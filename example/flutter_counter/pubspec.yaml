name: flutter_counter
description: "The Flutter counter app on spring_boot_starter_flutter."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  spring_boot_starter_flutter: ^0.2.1

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.2.1
  spring_core_dart_generator: ^0.2.1

flutter:
  uses-material-design: true
  # Injected with @Value('asset:...') (lib/src/about/app_assets.dart).
  assets:
    - assets/images/
    - assets/texts/
