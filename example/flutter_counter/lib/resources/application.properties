counter.title=Flutter Demo Home Page
counter.step=1

# The app widget: a MaterialApp (Scaffold and AppBar need it) without the
# debug banner, which would cover the app bar's About button. The locales
# come from messages.properties and messages_ja.properties.
spring.flutter.app.type=material
spring.flutter.app.title=${counter.title}
spring.flutter.app.debug-banner=false

# The theme (spring.flutter.theme.*): the palette from one seed color;
# Japanese glyphs from the system's fonts on devices, in tests from the
# cut-down font of test/fonts/.
spring.flutter.theme.seed-color=deepPurple
spring.flutter.theme.typography.font-family-fallback=Noto Sans JP
