name: supabase_example_function
description: "The Edge Function of the Supabase example, written in Dart: a REST API over the project's todos as the caller, compiled to JavaScript for Supabase's Edge Runtime."
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# The edge starter (the application as a function, with the web starter),
# the security starter (the resource server that checks the project's
# tokens) and the Supabase starter (the repositories over the project's
# REST API, the rate limiter's counters in its database). No database
# driver: a function has no sockets, and reaches the project over HTTP.
dependencies:
  spring_boot_starter_edge: ^0.7.3
  spring_boot_starter_security: ^0.7.3
  spring_boot_starter_supabase: ^0.7.3

dev_dependencies:
  build_runner: ^2.17.0
  spring_core_dart_generator: ^0.7.3
  test: ^1.33.0
