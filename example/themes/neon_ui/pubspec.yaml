name: neon_ui
description: "NEON design system, an example library: widgets, fonts and a theme written in YAML (themes without Dart), for apps of type widgets."
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The theme (spring.flutter.theme.*), the typed keys, ThemeStates,
  # ThemeAnimation. LogBuffer comes with it, and spring_boot_dart
  # (@AutoConfiguration), which it exports.
  spring_boot_starter_flutter: ^0.7.0

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_core_dart_generator: ^0.7.0

flutter:
  assets:
    - assets/images/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
