<!-- The page loader of the `neon-gate` kind (neon_ui): what the browser
     shows before Flutter runs, the same picture as NeonGateLoader (the
     Flutter splash), so the hand-off has no jump. The generator puts this in
     web/index.html and fills the variables from the loader's keys in
     themes/neon.yml (gate.color is --gate-color, edge.accent is
     --edge-accent); --spring-progress is the progress the script shows
     (with the fill phase's min-duration). Each panel slides in on its own
     share of the phase enter (--d its start, --s its length) from its side
     (--dx, --dy), with the easing the Flutter side uses; the edges flicker
     on time from the page's start (--ph, the phase of the cycle). The
     numbers are the same as in lib/src/neon_gate_loader.dart. The panels
     part in the Flutter splash, which takes over before. The font is the
     package's, which Flutter serves below assets/packages/neon_ui/. -->
<link rel="preload" as="font" type="font/ttf" crossorigin href="assets/packages/neon_ui/assets/fonts/JetBrainsMono-SemiBold.ttf">
<style>
@font-face{font-family:"NEON JetBrains Mono";font-weight:600;font-display:block;src:url(assets/packages/neon_ui/assets/fonts/JetBrainsMono-SemiBold.ttf) format("truetype")}
@property --spring-progress{syntax:"<number>";inherits:true;initial-value:0}
#spring-loader .sl-body,#spring-loader .sl-kind{display:contents}
#spring-loader .ng{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none}
/* A panel: its shape, then its edge twice (a blurred copy is the glow). */
#spring-loader .ng-l{position:absolute;top:0;left:0;width:100%;height:100%;
animation:ng-in calc(var(--phases-enter-duration,2000ms) * var(--s)) cubic-bezier(.05,.7,.1,1) calc(var(--phases-enter-duration,2000ms) * var(--d)) both}
@keyframes ng-in{from{transform:translate(calc(var(--dx) * 100%),calc(var(--dy) * 100%))}to{transform:translate(0,0)}}
#spring-loader .ng-l svg,#spring-loader .ng-fl{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
#spring-loader .ng-f{fill:var(--gate-color)}
#spring-loader .ng-p .ng-f{fill:var(--gate-panel)}
#spring-loader .ng-e{fill:none;stroke:var(--edge-color);stroke-width:calc(var(--edge-width,2) * 1px);vector-effect:non-scaling-stroke}
#spring-loader .ng-a .ng-e{stroke:var(--edge-accent)}
#spring-loader svg.ng-g{filter:blur(calc(var(--edge-glow,6) * 1px))}
#spring-loader .ng-g .ng-e{stroke-width:calc(var(--edge-width,2) * 2px)}
#spring-loader .ng-fl{animation:ng-flick var(--flicker-duration,2400ms) linear infinite;animation-delay:calc(var(--flicker-duration,2400ms) * var(--ph) * -1)}
@keyframes ng-flick{0%,5%,12%,55%,58%,62%,100%{opacity:1}6%{opacity:calc(1 - var(--flicker-dim,.5) * .9)}8%{opacity:calc(1 - var(--flicker-dim,.5) * .1)}10%{opacity:calc(1 - var(--flicker-dim,.5) * .6)}56%{opacity:calc(1 - var(--flicker-dim,.5) * .7)}60%{opacity:calc(1 - var(--flicker-dim,.5) * .4)}}
/* The box: angled, outlined in red, filled by the progress, the word at
   the left and the number at the right (the style label-small). It comes
   in the last fifth of enter. */
#spring-loader .ng-box{position:absolute;left:50%;top:50%;box-sizing:border-box;
width:min(calc(var(--box-width,420) * 1px),60vw);height:calc(var(--box-height,46) * 1px);
transform:translate(-50%,-50%) skewX(calc(var(--box-skew,-18) * 1deg));
animation:ng-box calc(var(--phases-enter-duration,2000ms) * .2) cubic-bezier(.05,.7,.1,1) calc(var(--phases-enter-duration,2000ms) * .8) both;
font:600 calc(var(--box-height,46) * .42px)/1 "NEON JetBrains Mono",monospace}
@keyframes ng-box{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
#spring-loader .ng-bglow{position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;border:2px solid var(--box-color);filter:blur(calc(var(--box-glow,10) * 1px));opacity:.9}
#spring-loader .ng-track{position:absolute;top:0;right:0;bottom:0;left:0;border:2px solid var(--box-color);overflow:hidden;background:color-mix(in srgb,var(--box-color) 12%,var(--gate-color))}
#spring-loader .ng-fill{position:absolute;top:0;bottom:0;left:0;width:calc(var(--spring-progress) * 100%);background:var(--box-fill);box-shadow:inset -2px 0 0 rgba(255,255,255,.85)}
#spring-loader .ng-lab,#spring-loader .ng-pct{position:absolute;top:2px;bottom:2px;display:flex;align-items:center;color:var(--box-text);white-space:nowrap}
#spring-loader .ng-lab{left:14px;font-size:calc(var(--label-size,10) * 1px);letter-spacing:calc(var(--label-letter-spacing,1.6) * 1px);text-transform:uppercase}
#spring-loader .ng-lab::before{content:var(--label-text)}
#spring-loader .ng-pct{right:14px;counter-reset:ng-pct calc(var(--spring-progress) * 100);letter-spacing:1px}
#spring-loader .ng-pct::before{content:counter(ng-pct) "%"}
</style>
