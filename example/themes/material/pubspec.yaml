name: theme_showcase_material
description: "Theme Showcase Material: the theme of spring_boot_starter_flutter on a MaterialApp. Every capability, written in YAML."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # The icons of the Cupertino widgets (CupertinoIcons); see flutter: below.
  cupertino_icons: ^1.0.8
  # Material's widgets, which the pages use themselves (Flutter 3.50 has
  # them in this package, not in the SDK).
  material_ui: ^1.11.0
  # Cupertino's widgets, for the Cupertino section of the Components page.
  cupertino_ui: ^1.1.6
  # Material Design for the app (spring.flutter.app.type: material): the
  # MaterialApp, ThemeData with `components.*`, the palette of a seed
  # color. It brings and exports the Flutter starter:
  # SpringApplicationWidget, the theme (spring.flutter.theme.*), the typed
  # keys, ThemeStates, ThemeAnimation, ThemeBackground, ThemeImage.
  spring_boot_starter_flutter_material: ^0.8.0
  # The `cupertino.*` section of the theme as a CupertinoThemeData
  # (CupertinoThemes), shown in a box of the Components page.
  spring_boot_starter_flutter_cupertino: ^0.8.0
  # The pages as screens with their own addresses (@ScreenRoute, the
  # @RouteShell with the rail).
  spring_boot_starter_flutter_navigation: ^0.8.0

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.0
  spring_core_dart_generator: ^0.8.0

flutter:
  # The font of Material's icons (Icons.*). The Cupertino widgets of the
  # Components page have their icon font in cupertino_icons above; the
  # unused glyphs are cut out of a release build.
  uses-material-design: true
  assets:
    # The images of the image and background examples (an asset is the
    # fallback of a network image, too).
    - assets/images/
