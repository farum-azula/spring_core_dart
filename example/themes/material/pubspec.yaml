name: theme_showcase_material
description: "Theme Showcase Material: the theme of spring_boot_starter_flutter on a MaterialApp. Every capability, written in YAML."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The icons of the Cupertino widgets (CupertinoIcons); see flutter: below.
  cupertino_icons: ^1.0.8
  # SpringApplicationWidget, the theme (spring.flutter.theme.*), the typed
  # keys, ThemeStates, ThemeAnimation, ThemeBackground, ThemeImage.
  spring_boot_starter_flutter: ^0.6.3

  # Imported by the generated code (lib/spring_gen/).
  spring_boot_dart: ^0.6.3
  spring_boot_starter_logging: ^0.6.3
  spring_core_dart: ^0.6.3
dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.6.3
  spring_core_dart_generator: ^0.6.3
  # test/themes_test.dart: HttpTransport, to keep the network profile offline.
  spring_web_dart: ^0.6.3

flutter:
  # MaterialApp and CupertinoApp are both in the starter (the theme picks
  # one at run time), so the build looks for both icon fonts; the unused
  # glyphs are cut out of a release build.
  uses-material-design: true
  assets:
    # The images of the image and background examples (an asset is the
    # fallback of a network image, too).
    - assets/images/
