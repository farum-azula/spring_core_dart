name: theme_showcase_cupertino
description: "Theme Showcase Cupertino: the theme of spring_boot_starter_flutter on a CupertinoApp, with Cupertino widgets only. Every capability, written in YAML."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # The icons of the Cupertino widgets (CupertinoIcons).
  cupertino_icons: ^1.0.8
  # Cupertino's widgets, which the pages use themselves (Flutter 3.50 has
  # them in this package, not in the SDK).
  cupertino_ui: ^1.1.6
  # Cupertino for the app (spring.flutter.app.type: cupertino): the
  # CupertinoApp, CupertinoThemeData from `cupertino.*`, the iOS page
  # route with its swipe back.
  spring_boot_starter_flutter_cupertino: ^0.8.0
  # The pages on routes (@ScreenRoute), the tabs as a shell with a stack per
  # tab, the browser's addresses. It brings and exports the Flutter starter:
  # SpringApplicationWidget, the theme (spring.flutter.theme.*), the typed
  # keys, ThemeStates, ThemeAnimation, ThemeBackground, ThemeImage.
  spring_boot_starter_flutter_navigation: ^0.8.0

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.0
  spring_core_dart_generator: ^0.8.0

flutter:
  # The font of the Material icons, for the copy button of the code boxes
  # (MarkdownView draws it from that font; the app has no Material
  # widget). The unused glyphs are cut out of a release build.
  uses-material-design: true
  assets:
    # The images of the image and background examples (an asset is the
    # fallback of a network image, too).
    - assets/images/
