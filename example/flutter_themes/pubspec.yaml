name: flutter_themes
description: "Themes from properties on spring_boot_starter_flutter: light, dark, system and custom themes, switched at run time."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  spring_boot_starter_flutter: ^0.3.0

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.3.0
  spring_core_dart_generator: ^0.3.0

flutter:
  uses-material-design: true
  assets:
    # Fonts in any asset directory: the starter loads them by the family
    # their files name (Roboto, Roboto Condensed); listed nowhere else.
    - res/fonts/roboto/
    - res/fonts/condensed/
    # A theme as a server would send it (see GalleryPage: "Load from server").
    - assets/remote/
