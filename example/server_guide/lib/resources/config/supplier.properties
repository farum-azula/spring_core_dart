# Imported by application.properties (spring.config.import): the supplier
# service the Feign clients call. Its -{profile} variants are read too
# (config/supplier-dev.properties).
neon.supplier.url=https://supplier.neon.books/api
# A secret: from the environment (SUPPLIER_API_KEY), empty when not set
# (restocking is then switched off, see SupplierConfigured).
neon.supplier.api-key=${SUPPLIER_API_KEY:}
