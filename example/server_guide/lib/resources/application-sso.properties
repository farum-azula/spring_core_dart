# The sso profile: single sign-on with Keycloak (example/keycloak, the
# realm `neon` on port 8180) instead of the form login. Chapter 4.
#   dart run bin/main.dart --spring.profiles.active=dev,sso

# Where the browser goes after a Keycloak login or logout: the Flutter web
# app (`flutter run -d chrome --web-port 5050` in example/flutter_guide).
neon.app.web-url=http://localhost:5050/

# --- oauth2Login(): this server logs browsers in (Flutter web) -----------
# A confidential client: the server has a secret, the browser never sees
# the tokens. Keycloak sends the browser back to the default redirect URI,
# {baseUrl}/login/oauth2/code/{registrationId}
# (http://localhost:8080/login/oauth2/code/keycloak).
spring.security.oauth2.client.registration.keycloak.client-id=neon-server
# A development value, public in example/keycloak/neon-realm.json. Any
# real Keycloak gets its own secret, from the environment:
# NEON_KEYCLOAK_SECRET=... dart run bin/main.dart ...
spring.security.oauth2.client.registration.keycloak.client-secret=${NEON_KEYCLOAK_SECRET:neon-server-dev-secret}
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
# Everything else (endpoints, keys) comes from the issuer's metadata.
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/neon
# The user's name is `ada` or `root`, as with the form login (orders
# belong to a name), not Keycloak's id (`sub`).
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# --- Bearer tokens: the native apps log in themselves ---------------------
# Their access tokens are checked against the realm's keys, issuer and
# audience (Keycloak adds `neon-api` to the tokens of neon-app).
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/neon
spring.security.oauth2.resourceserver.jwt.audiences=neon-api
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
# The realm roles, in the token's `roles` claim: USER -> ROLE_USER.
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
