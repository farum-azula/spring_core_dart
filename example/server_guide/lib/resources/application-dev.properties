# The dev profile (the default): sample data, a local supplier stub, more
# logging. Profile files are read on top of application.properties.

# Loaded into the empty catalog at startup (SampleData, @Profile dev).
neon.catalog.sample-data=classpath:data/books.json
# Faster restocking to watch the live stock in the app.
neon.stock.restock-interval=20s
logging.level.spring.web.mvc=info
