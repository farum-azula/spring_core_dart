# NEON Books server: the configuration every profile shares.
# lib/resources/ is the classpath (src/main/resources in Java): the
# generator embeds these files, so `classpath:` works in `dart run`, AOT
# executables and tests alike. Chapter 2 of the README walks through it.

spring.application.name=neon-books
# dev unless the command line (--spring.profiles.active=prod) or the
# environment (SPRING_PROFILES_ACTIVE=prod) says otherwise.
spring.profiles.active=dev
# A profile group: dev brings the supplier stub with it.
spring.profiles.group.dev=supplier-stub
# More files: the supplier's address and key (optional: absent is fine).
spring.config.import=optional:classpath:config/supplier.properties
# MessageSource: classpath:messages/messages*.properties (en, ja).
spring.messages.basename=messages/messages
# Close the context on Ctrl+C / SIGTERM: graceful shutdown of the server.
spring.main.register-shutdown-hook=true

# --- The web server (spring_boot_starter_web) -----------------------------
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.max-http-request-body-size=1MB
server.compression.enabled=true
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Keeps idle event streams open through proxies.
spring.mvc.sse.heartbeat-interval=15s

# --- JSON (ObjectMapper) ---------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# --- The shop (@ConfigurationProperties ShopProperties) --------------------
neon.shop.name=NEON Books
neon.shop.opens-at=9
neon.shop.closes-at=21
neon.shop.max-basket-size=10
neon.shop.delivery-time=2d
neon.shop.max-cover-size=512KB

# The catalog: page size, and where uploaded covers are kept.
neon.catalog.page-size=10
neon.covers.directory=build/covers

# Orders are shipped this long after they are placed (TaskScheduler).
neon.orders.shipping-delay=5s

# Stock: restock books below the threshold, every restock-interval
# (@Scheduled fixed delay) and report at 06:00 (cron).
neon.stock.low-threshold=2
neon.stock.restock-interval=30s
neon.stock.restock-initial-delay=10s
neon.stock.report-cron=0 0 6 * * *
# Server-sent events kept for clients that reconnect with Last-Event-ID.
neon.stock.replay-size=100

# The support chat's bot (off: only humans answer).
neon.support.bot.enabled=true

# --- Users ------------------------------------------------------------------
# In memory, passwords as {argon2} hashes (tool/hash_password.dart), never
# as they are. Override per environment: NEON_SECURITY_USERS_ROOT_PASSWORD.
neon.security.users.ada.password={argon2}$argon2id$v=19$m=16384,t=2,p=1$nvd2L/IEt9yQ0mCeI4V6ow$OvES6oQDiZXXRGP6Asd/8hzR/SOa7t991TW1LaZcq9Q
neon.security.users.ada.roles=USER
neon.security.users.root.password={argon2}$argon2id$v=19$m=16384,t=2,p=1$tjsMTThOt2qDAng+KxZnhQ$bSbP+/b78i0IUQmD+hEuLPSdGADCW+ZKYc38gDEopxs
neon.security.users.root.roles=USER,ADMIN

# --- Cache (spring_boot_starter_cache) ---------------------------------------
spring.cache.simple.max-size=500
spring.cache.simple.time-to-live=10m
spring.cache.simple.caches.catalog.time-to-live=1m
spring.cache.simple.caches.supplier-offers.time-to-live=5m

# --- Feign: the supplier ------------------------------------------------------
spring.cloud.openfeign.client.config.default.connect-timeout=2s
spring.cloud.openfeign.client.config.default.read-timeout=5s
spring.cloud.openfeign.client.config.supplier-offers.logger-level=basic
spring.cloud.openfeign.client.config.supplier-deliveries.logger-level=basic

# --- Logging (spring_boot_starter_logging) ----------------------------------
logging.level.root=info
# A log group: the loggers named by topic (neon.*) and the @Log defaults
# (the package name, neon_books_server.*).
logging.group.shop=neon,neon_books_server
logging.level.shop=debug
logging.level.feign=debug
# Shorter than Spring Boot's, aligned the same way: the level padded to 5,
# the logger abbreviated and padded to 30. Coloured like Spring Boot's
# (spring.output.ansi.enabled=never for plain text).
logging.pattern.console=%d{HH:mm:ss.SSS} %5p %-30.30logger{29} : %m%X%n%ex
logging.buffer.capacity=2000

#---
# A second document of this file, for every profile but prod (a negated
# on-profile guard): CORS for the Flutter web build on any localhost port.
spring.config.activate.on-profile=!prod
neon.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]
