# English (the default). Spring's MessageFormat: {0} arguments, choice.
shop.welcome=Welcome to {0}!
order.confirmation.subject=Your order {0} at {1}
order.items={0,choice,0#no books|1#one book|1<{0,number,integer} books}

bot.greeting=Hi {0}, this is the NEON Books support bot. Ask about delivery, opening hours or refunds.
bot.delivery=Books are delivered within {0} days.
bot.hours=We are open from {0}:00 to {1}:00.
bot.refund=Refunds are possible within 14 days; a person from the shop will contact you.
bot.fallback=Thanks, {0}! Someone from the shop will answer soon.

# Validation messages: Spring's codes, most specific first
# (NotBlank.newBook.title, NotBlank.title, NotBlank). The object name is
# the name of the validated parameter (newBook, quantityRequest). {0} is
# the field, then the constraint's attributes ({1}: the limit of Min/Max).
# @Matches keeps Bean Validation's code, Pattern.
NotBlank=must not be blank
NotEmpty=must not be empty
NotNull=must be given
Positive=must be above zero
PositiveOrZero=must not be negative
Min=must be at least {1}
Max=must be at most {1}
Size=is too long
Pattern=has the wrong format
ValidOpeningHours=The shop must close after it opens
NotBlank.newBook.title=Every book needs a title
Pattern.newBook.isbn=An ISBN has 13 digits and starts with 978 or 979
Positive.newBook.price=The price must be above zero
Min.quantityRequest.quantity=The quantity cannot be negative
Max.quantityRequest.quantity=At most {1} copies per book
typeMismatch=has an invalid value
