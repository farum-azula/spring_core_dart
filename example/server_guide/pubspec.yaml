name: neon_books_server
description: "NEON Books, the bookstore's server: a guide to Spring Boot in Dart (web, security, WebSocket, Feign, cache, scheduling, logging, testing)."
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# Only packages of this repository. The security starter brings the web
# starter, spring_security_core, spring_boot_dart, spring_core_dart and the
# logging starter; the others are listed for what they add.
dependencies:
  spring_boot_dart: ^0.3.2
  spring_boot_starter_cache: ^0.3.2
  spring_boot_starter_feign: ^0.3.2
  spring_boot_starter_logging: ^0.3.2
  spring_boot_starter_scheduling: ^0.3.2
  spring_boot_starter_security: ^0.3.2
  spring_boot_starter_web: ^0.3.2
  spring_boot_starter_websocket: ^0.3.2
  spring_core_dart: ^0.3.2
  spring_security_core: ^0.3.2
  spring_web_dart: ^0.3.2

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.3.2
  spring_core_dart_generator: ^0.3.2
  test: ^1.33.0
