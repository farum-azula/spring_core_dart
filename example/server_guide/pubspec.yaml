name: neon_books_server
description: "NEON Books, the bookstore's server: a guide to Spring Boot in Dart (web, security, WebSocket, Feign, cache, scheduling, logging, testing)."
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# The starters the server uses, and nothing they bring: the web starter
# brings and exports spring_boot_dart, spring_core_dart, spring_web_dart and
# the logging starter; the security starter spring_security_core (and its
# testing.dart through package:spring_boot_starter_security/testing.dart).
dependencies:
  spring_boot_starter_cache: ^0.7.3
  spring_boot_starter_feign: ^0.7.3
  spring_boot_starter_scheduling: ^0.7.3
  spring_boot_starter_security: ^0.7.3
  spring_boot_starter_web: ^0.7.3
  spring_boot_starter_websocket: ^0.7.3

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.7.3
  spring_core_dart_generator: ^0.7.3
  test: ^1.33.0
