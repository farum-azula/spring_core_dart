# The test classpath (src/test/resources in Java): read by springBootTest
# on top of lib/resources/, never embedded into the application. Active
# with profiles: [..., 'test'].
logging.console.enabled=false
spring.main.banner-mode=off
spring.main.register-shutdown-hook=false
# Uploaded covers of the tests, apart from the application's.
neon.covers.directory=build/test-covers
# No restocking while the tests run (they call the job themselves) and
# orders ship at once.
neon.stock.restock-initial-delay=1h
neon.orders.shipping-delay=50ms
