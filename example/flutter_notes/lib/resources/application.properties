# The REST API: dart:io's HttpServer inside the app. Flutter apps listen on
# 127.0.0.1 unless server.address says otherwise (0.0.0.0: reachable from
# the network, e.g. a phone from your computer).
server.port=8082

# The app widget: a MaterialApp without the debug banner.
spring.flutter.app.type=material
spring.flutter.app.title=Notes
spring.flutter.app.debug-banner=false

spring.flutter.theme.seed-color=teal
