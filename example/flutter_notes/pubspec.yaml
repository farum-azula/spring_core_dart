name: flutter_notes
description: "Notes in a Flutter app, also served by its own REST API (spring_boot_starter_web)."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  spring_boot_starter_flutter: ^0.3.1
  # The REST API: a dart:io server inside the app, on 127.0.0.1.
  spring_boot_starter_web: ^0.3.1

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.3.1
  spring_core_dart_generator: ^0.3.1

flutter:
  uses-material-design: true
