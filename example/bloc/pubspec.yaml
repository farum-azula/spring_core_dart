name: bloc_showcase
description: "Bloc Showcase: Bloc and Cubit as beans of a Spring Boot Flutter app, with no starter of their own: injection, the app's and a screen's lifetime, their changes as application events."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # Bloc and Cubit, and the widgets that rebuild by their states
  # (BlocBuilder, BlocSelector). The app's own choice: the framework has
  # no starter for it and needs none.
  flutter_bloc: ^9.1.1
  # The screens with their own addresses, and a bean that lives as long as
  # a screen (the `route` scope). It brings and exports the Flutter
  # starter (SpringApplicationWidget, context.bean).
  spring_boot_starter_flutter_navigation: ^0.8.0

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.0
  spring_core_dart_generator: ^0.8.0
