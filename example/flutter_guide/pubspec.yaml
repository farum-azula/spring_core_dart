name: neon_books_app
description: "NEON Books, the bookstore's Flutter app: the Flutter guide of spring_core_dart, a client of example/server_guide."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # The app: SpringApplicationWidget, Spring widgets, themes, assets.
  spring_boot_starter_flutter: ^0.4.2
  # The server's REST API as @FeignClient interfaces (chapter 6).
  spring_boot_starter_feign: ^0.4.2
  # The support chat as a @WebSocketClient (chapter 6).
  spring_boot_starter_websocket: ^0.4.2
  # @Cacheable catalog reads (chapter 8).
  spring_boot_starter_cache: ^0.4.2
  # @Scheduled catalog refresh (chapter 8).
  spring_boot_starter_scheduling: ^0.4.2
  # SecurityContextHolder and @PreAuthorize (chapter 7).
  spring_security_core: ^0.4.2

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.4.2
  spring_core_dart_generator: ^0.4.2

flutter:
  uses-material-design: true
  assets:
    # Injected with @Value('asset:...') (lib/src/about/app_assets.dart).
    - assets/images/
    - assets/texts/
    # A theme as the server could send it (Settings: "Load a theme").
    - assets/remote/
    # Fonts in asset directories of their own: the starter loads them by
    # the family their files name (Roboto, Roboto Condensed).
    - res/fonts/roboto/
    - res/fonts/condensed/
