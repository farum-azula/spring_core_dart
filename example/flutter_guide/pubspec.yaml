name: neon_books_app
description: "NEON Books, the bookstore's Flutter app: the Flutter guide of spring_core_dart, a client of example/server_guide."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # The icons of the Cupertino widgets (CupertinoIcons); see flutter: below.
  cupertino_icons: ^1.0.8
  # The app: SpringApplicationWidget, Spring widgets, themes, assets
  # (spring_boot_starter_flutter), and its security (chapter 7): the
  # Keycloak login of the app (OAuth2LoginService) in the system's login
  # window, secrets in the Keychain / Keystore, SecurityContextHolder and
  # @PreAuthorize, the widgets that follow the user. It brings and
  # re-exports the Flutter starter, the OAuth2 client and
  # spring_security_core.
  spring_boot_starter_flutter_security: ^0.8.1
  # Material Design for the app (spring.flutter.app.type=material): the
  # MaterialApp, the themes as Material's ThemeData, the palette of a seed.
  spring_boot_starter_flutter_material: ^0.8.1
  # Material's widgets (Scaffold, AppBar, Icons), which the pages import.
  material_ui: ^1.11.0
  # The server's REST API as @FeignClient interfaces (chapter 6).
  spring_boot_starter_feign: ^0.8.1
  # The support chat as a @WebSocketClient (chapter 6).
  spring_boot_starter_websocket: ^0.8.1
  # @Cacheable catalog reads (chapter 8).
  spring_boot_starter_cache: ^0.8.1
  # @Scheduled catalog refresh (chapter 8).
  spring_boot_starter_scheduling: ^0.8.1

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # integration_test/: the secret store, the DPoP key and the login window
  # on the real device.
  integration_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.1
  spring_core_dart_generator: ^0.8.1
  # integration_test/dpop_key_test.dart: the DPoP proofs' signatures
  # checked by an ECDSA verifier that is not the code tested (it comes
  # with the OAuth2 client anyway).
  pointycastle: ^4.0.0

flutter:
  # The font of Material's icons (Icons.*). material_ui builds on
  # cupertino_ui, so the build looks for the Cupertino icon font too
  # (cupertino_icons above); the unused glyphs are cut out of a release
  # build.
  uses-material-design: true
  assets:
    # Injected with @Value('asset:...') (lib/src/about/app_assets.dart).
    - assets/images/
    - assets/texts/
    # A theme as the server could send it (Settings: "Load a theme").
    - assets/remote/
    # Fonts in asset directories of their own: the starter loads them by
    # the family their files name (Roboto, Roboto Condensed).
    - res/fonts/roboto/
    - res/fonts/condensed/
