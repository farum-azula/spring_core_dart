# The spa profile, optional and for the web app only: the browser logs in
# at Keycloak by itself (spring_boot_starter_flutter_security, spa mode)
# instead of through the server guide (server mode, the default). Keycloak
# (example/keycloak) with the public browser client neon-web:
#   flutter run -d chrome --dart-define=SPRING_PROFILES_ACTIVE=sso,spa
# The page logs in, shows the user, survives a reload (a silent prompt=none
# trip to Keycloak) and logs out at Keycloak. The calls to the server
# guide stay anonymous: see the README, "The web app without a server
# login (spa mode)".
spring.flutter.security.web.mode=spa

# The registration of the browser: a public client (no secret), PKCE, the
# app's own page as the redirect URI ({baseUrl} is the page's origin and
# base href: http://localhost:5050). Keycloak allows the page's origin on
# its token, user info and revocation endpoints (the client's web
# origins).
spring.security.oauth2.client.registration.keycloak.client-id=neon-web
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/
# DPoP when Keycloak's discovery offers ES256 (it does): the tokens are
# bound to a WebCrypto key the page cannot export.
spring.security.oauth2.client.registration.keycloak.dpop=auto
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/neon
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
# Back to the app after Keycloak's logout (allowed by neon-web).
neon.sso.post-logout-redirect-uri=http://localhost:5050/

# The page's Content Security Policy, for the production host's headers
# (and for `flutter run` when this profile is named in a config file: the
# dev server reads only the files the build sees). The spa mode's default
# plus the server guide, which the Feign clients and the support chat
# call.
spring.flutter.web.content-security-policy=default-src 'self'; \
  script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; \
  style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; \
  font-src 'self' https://fonts.gstatic.com; \
  connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com \
  http://localhost:8180 http://localhost:8080 ws://localhost:8080; \
  worker-src 'self' blob:; object-src 'none'; base-uri 'self'; \
  form-action 'self'; frame-ancestors 'none'
