# Browsers: a wide window. The page's origin must be allowed by the
# server's CORS settings (the server guide allows localhost).
app.navigation=rail

# `flutter run -d chrome` (or -d web-server) serves the app on
# http://localhost:5050/, the origin the server's CORS and SSO settings
# expect. spring_core_dart_generator writes it into web_dev_config.yaml,
# which the Flutter tool reads; a --web-port flag still wins.
spring.flutter.web.port=5050

# The login of the web app (spring_boot_starter_flutter_security, server
# mode): the server guide logs the user in and keeps the session, the
# page holds only its HttpOnly cookie. The server is another origin
# (localhost:8080), so the starter's transport sends the cookies there
# and the CSRF token of its XSRF-TOKEN cookie; "who is logged in" and the
# logout are the server guide's /api/me and /api/logout, the form login's
# as well as Keycloak's.
spring.flutter.security.web.server-url=${api.base-url}
spring.flutter.security.web.user-endpoint=/api/me
spring.flutter.security.web.logout-url=/api/logout
