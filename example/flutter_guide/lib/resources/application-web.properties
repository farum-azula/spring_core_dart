# Browsers: a wide window. The page's origin must be allowed by the
# server's CORS settings (the server guide allows localhost).
app.navigation=rail

# `flutter run -d chrome` (or -d web-server) serves the app on
# http://localhost:5050/, the origin the server's CORS and SSO settings
# expect. spring_core_dart_generator writes it into web_dev_config.yaml,
# which the Flutter tool reads; a --web-port flag still wins.
spring.flutter.web.port=5050
