# NEON Books, the app. The platform profiles (mobile, android, ios,
# desktop, macos, windows, linux, web) add their own files:
# application-<profile>.properties. The theme is in application.yml.

app.title=NEON Books

# The server guide (example/server_guide): `dart run bin/main.dart` there.
# The Feign clients use api.base-url, the support chat api.ws-url.
# `flutter run --dart-define=API_HOST=192.168.1.20:8080` for a phone on
# the LAN.
api.host=localhost:8080
api.base-url=http://${api.host}
api.ws-url=ws://${api.host}
api.connect-timeout=5s

# The Feign clients: a short read timeout (the default is 60s), the calls
# logged at debug level (the Logs screen shows them).
spring.cloud.openfeign.client.config.default.read-timeout=10s
spring.cloud.openfeign.client.config.default.logger-level=basic
# The stock events reconnect after 2s and give up after 10 silent tries.
spring.cloud.openfeign.client.config.stock.event-stream.reconnect-delay=2s
spring.cloud.openfeign.client.config.stock.event-stream.max-attempts=10

# The support chat's socket reconnects, waiting 1s, 2s, 4s, ... up to 30s.
spring.websocket.client.config.support.reconnect.delay=1s
spring.websocket.client.config.support.reconnect.max-delay=30s

# The catalog refresh (lib/src/catalog/catalog_refresh.dart).
catalog.refresh-interval=5m

# The caches of lib/src/catalog/catalog_service.dart, in memory.
spring.cache.cache-names=catalog,books,covers

# Logging: the console in Boot's format, and the in-memory LogBuffer the
# Logs screen shows (debug and up, the last 500 lines).
logging.level.root=info
logging.level.neon=debug
logging.level.feign=debug
logging.buffer.capacity=500
logging.threshold.buffer=debug

# The app widget: a MaterialApp (Scaffold and AppBar need it) without the
# debug banner. The locales come from messages.properties and
# messages_ja.properties.
spring.flutter.app.type=material
spring.flutter.app.title=${app.title}
spring.flutter.app.debug-banner=false
spring.cache.simple.caches.covers.max-size=50

# Single sign-on with Keycloak (chapter 7): off, the app logs in with a
# name and password (the server's form login). The `sso` profile turns it
# on (application-sso.properties):
#   flutter run --dart-define=SPRING_PROFILES_ACTIVE=sso
neon.sso.enabled=false

#---
# With `sso`, the native apps log in themselves at Keycloak: a public
# client (no secret in an app), PKCE, the system's login window. A
# document guarded by profiles, here and not in application-sso.properties,
# because only the native apps have it (a profile file cannot be guarded,
# as in Spring Boot): a web page never holds tokens, its server logs it in.
spring.config.activate.on-profile=sso & !web
spring.security.oauth2.client.registration.keycloak.client-id=neon-app
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
# iOS, Android, macOS: the app's own scheme; the system's login window
# hands the redirect to the app (Android: RedirectReceiverActivity in the manifest).
spring.security.oauth2.client.registration.keycloak.redirect-uri=books.neon.app:/oauth2/callback
neon.sso.post-logout-redirect-uri=books.neon.app:/oauth2/logout
# Discovery: the endpoints come from the realm's metadata at the first
# login, not at startup (the app starts offline too). The Android
# emulator reaches it through `adb reverse tcp:8180 tcp:8180`: the issuer
# must be the same address everywhere, or the server refuses the tokens.
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/neon
# `ada` or `root`, the names the server knows, not Keycloak's ids.
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

#---
# Windows and Linux have no app schemes to catch: the redirect goes to a
# server of the app on 127.0.0.1, any free port (RFC 8252 §7.3).
spring.config.activate.on-profile=sso & (windows | linux)
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://127.0.0.1/oauth2/callback
neon.sso.post-logout-redirect-uri=http://127.0.0.1/oauth2/logout
