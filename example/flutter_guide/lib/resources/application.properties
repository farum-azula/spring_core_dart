# NEON Books, the app. The platform profiles (mobile, android, ios,
# desktop, macos, windows, linux, web) add their own files:
# application-<profile>.properties. The theme is in application.yml.

app.title=NEON Books

# The server guide (example/server_guide): `dart run bin/main.dart` there.
# The Feign clients use api.base-url, the support chat api.ws-url.
# `flutter run --dart-define=API_HOST=192.168.1.20:8080` for a phone on
# the LAN.
api.host=localhost:8080
api.base-url=http://${api.host}
api.ws-url=ws://${api.host}
api.connect-timeout=5s

# The Feign clients: a short read timeout (the default is 60s), the calls
# logged at debug level (the Logs screen shows them).
spring.cloud.openfeign.client.config.default.read-timeout=10s
spring.cloud.openfeign.client.config.default.logger-level=basic
# The stock events reconnect after 2s and give up after 10 silent tries.
spring.cloud.openfeign.client.config.stock.event-stream.reconnect-delay=2s
spring.cloud.openfeign.client.config.stock.event-stream.max-attempts=10

# The support chat's socket reconnects, waiting 1s, 2s, 4s, ... up to 30s.
spring.websocket.client.config.support.reconnect.delay=1s
spring.websocket.client.config.support.reconnect.max-delay=30s

# The catalog refresh (lib/src/catalog/catalog_refresh.dart).
catalog.refresh-interval=5m

# The caches of lib/src/catalog/catalog_service.dart, in memory.
spring.cache.cache-names=catalog,books,covers

# Logging: the console in Boot's format, and the in-memory LogBuffer the
# Logs screen shows (debug and up, the last 500 lines).
logging.level.root=info
logging.level.neon=debug
logging.level.feign=debug
logging.buffer.capacity=500
logging.threshold.buffer=debug

# The app widget: a MaterialApp (Scaffold and AppBar need it) without the
# debug banner. The locales come from messages.properties and
# messages_ja.properties.
spring.flutter.app.type=material
spring.flutter.app.title=${app.title}
spring.flutter.app.debug-banner=false
spring.cache.simple.caches.covers.max-size=50
