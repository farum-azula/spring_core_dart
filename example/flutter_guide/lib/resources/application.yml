# The look of the app: the shared part of every theme and the standard
# `dark` theme's differences. Each custom theme has a file of its own in
# themes/. No ThemeData in the code.
spring:
  config:
    import: >-
      resources:themes/neon.yml, resources:themes/neon-night.yml,
      resources:themes/sepia.yml, resources:themes/high-contrast.yml

  flutter:
    theme:
      # system | light | dark | neon | neon-night | sepia | high-contrast
      # (and `winter` once loaded at run time, see Settings)
      active: system
      system-dark: dark

      seed-color: deepPurple
      typography:
        font-family: Roboto
        # Japanese glyphs: the system's fonts on devices, in tests the
        # cut-down font of test/fonts/.
        font-family-fallback: [Noto Sans JP]
        display: { font-family: Roboto Condensed, weight: bold }
        headline: { font-family: Roboto Condensed }
        title-large: { weight: 500 }
        # A monospaced font file would go into res/fonts/ like the others;
        # Roboto Condensed stands in (the Logs screen).
        code: { font-family: Roboto Condensed, size: 12 }
      shape:
        medium: 16
      components:
        app-bar:
          scrolled-under-elevation: level2
        card:
          shape: large
          color: $colors.surface-container-low
        input:
          style: outline
          shape: small
        snack-bar:
          behavior: floating
      spacing:
        s: 8
        m: 16
        l: 24
      tokens:
        brand:
          accent: '#FF40A0'
          # A reference with a color object: follows a theme that
          # changes brand.accent.
          accent-soft: { color: $brand.accent, alpha: 16% }
          banner-height: 96
          # A nested group with a list: context.theme.tokens.brand.tag.
          tag:
            radius: 14
            labels: [New, Staff pick, Sale]
      motion:
        durations: { fast: 120ms, medium: 300ms }
      # A look per widget state for the app's own widgets (ThemeTag).
      styles:
        tag:
          padding: [12, 6]
          radius: $brand.tag.radius
          fill:
            default: $brand.accent-soft
            hovered: { color: $brand.accent, alpha: 28% }
            selected: $brand.accent
          transition: $motion.durations.fast ease-out
      # Played by ThemeAnimation (the tags rise into place).
      animations:
        rise: { duration: $motion.durations.medium, curve: ease-out }

      themes:
        dark:
          seed-color: deepPurple.shade200
          components:
            card: { color: $colors.surface-container }
