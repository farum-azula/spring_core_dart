# Desktops: the sections in a navigation rail, the window is wide.
app.title=NEON Books for desktop
app.navigation=rail

# The window (macOS, Windows, Linux): content under a transparent title bar
# (HomePage leaves room for the window buttons and the empty part of its app
# bar moves the window), opens at 1280x800 and cannot be made smaller than
# 800x600.
spring.flutter.desktop.window.title-bar=transparent
spring.flutter.desktop.window.initial-size=1280x800
spring.flutter.desktop.window.min-size=800x600
