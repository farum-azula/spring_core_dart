# The bookstore's own look: pink and cyan on deep violet.
spring:
  flutter:
    theme:
      themes:
        neon:
          seed-color: '#FF40A0'
          scheme-variant: vibrant
          colors:
            secondary: '#00B8D4'
          shape: { medium: 20, large: 28 }
          components:
            button: { shape: full }
            card: { elevation: level0, color: $colors.surface-container }
          tokens:
            brand: { accent: '#00E5FF' }
          styles:
            code:
              keyword: '#D1007A'
              string: '#00838F'
              number: '#7C4DFF'
              key: '#C2185B'
              annotation: '#0097A7'
              variable: '#7B1FA2'
              type: '#00695C'
