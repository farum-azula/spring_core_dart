# The sso profile: log in with Keycloak (example/keycloak) instead of a
# name and password. The server must run with it too:
#   (cd ../server_guide && dart run bin/main.dart --spring.profiles.active=dev,sso)
#   flutter run --dart-define=SPRING_PROFILES_ACTIVE=sso
#   flutter run -d chrome --web-port 5050 --dart-define=SPRING_PROFILES_ACTIVE=sso
# The Login screen shows "Sign in with Keycloak". Native apps log in
# themselves (the registration at the end of application.properties); the
# web app goes to the server's /oauth2/authorization/keycloak and comes
# back with a session cookie (the server's neon.app.web-url must be the
# page's address).
neon.sso.enabled=true
