# Inside this repository: the family's packages from their folders (the
# app is not in the pub workspace, because flutter_test pins test_api).
dependency_overrides:
  spring_boot_dart:
    path: ../../spring_boot_dart
  spring_boot_starter_cache:
    path: ../../spring_boot_starter_cache
  spring_boot_starter_feign:
    path: ../../spring_boot_starter_feign
  spring_boot_starter_flutter:
    path: ../../spring_boot_starter_flutter
  spring_boot_starter_logging:
    path: ../../spring_boot_starter_logging
  spring_boot_starter_oauth2_client:
    path: ../../spring_boot_starter_oauth2_client
  spring_boot_starter_scheduling:
    path: ../../spring_boot_starter_scheduling
  spring_boot_starter_test:
    path: ../../spring_boot_starter_test
  spring_boot_starter_websocket:
    path: ../../spring_boot_starter_websocket
  spring_core_dart:
    path: ../../spring_core_dart
  spring_core_dart_generator:
    path: ../../spring_core_dart_generator
  spring_security_core:
    path: ../../spring_security_core
  spring_web_dart:
    path: ../../spring_web_dart
