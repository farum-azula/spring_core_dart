# lib/resources/ is the classpath (like src/main/resources): this file is
# found as classpath:application.properties (Spring Boot config data).
app.name=NEON Books
app.currency=EUR
# Spring Boot's MessageSourceAutoConfiguration: classpath:messages/messages*.properties
spring.messages.basename=messages/messages
spring.profiles.active=dev
spring.profiles.group.dev=dev-tools
spring.config.import=optional:classpath:extra.properties

# Environment variables in property values, like Spring: ${NAME} or
# ${NAME:default}. Run e.g. `DB_PASSWORD=s3cret dart run bin/main.dart`.
db.user=${DB_USER:books}
db.password=${DB_PASSWORD:changeme}
db.connection=${db.user}@${db.url}

catalog.page-size=2
spring.application.name=neon-books
shop.delivery-time=2d
shop.opening-hours=9-21
shop.tags=fiction,science,poetry
feature.recommendations=true

# spring_boot_starter_logging (bin/shop.dart): levels per logger (also
# LOGGING_LEVEL_NEON_CHECKOUT=trace), console pattern, buffer size.
logging.level.neon=debug
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%logger] %m%X
logging.buffer.capacity=500
# Also a log file (relative to the working directory; build/ is ignored by
# git), rolled over at 1 MB into neon-books.log.1, .2, .3.
logging.file.name=build/logs/neon-books.log
logging.file.max-size=1MB
logging.file.max-history=3

#---
# A negated guard: applies to every profile except prod.
spring.config.activate.on-profile=!prod
log.level=DEBUG
