# Loaded by ConfigDataEnvironment from ./config/ (Spring Boot config data).
app.name=NEON Books
app.currency=EUR
spring.profiles.active=dev
spring.profiles.group.dev=dev-tools
spring.config.import=optional:file:./config/extra.properties

# Environment variables in property values, like Spring: ${NAME} or
# ${NAME:default}. Run e.g. `DB_PASSWORD=s3cret dart run bin/main.dart`.
db.user=${DB_USER:books}
db.password=${DB_PASSWORD:changeme}
db.connection=${db.user}@${db.url}

catalog.page-size=2
shop.delivery-time=2d
shop.tags=fiction,science,poetry
feature.recommendations=true

#---
# A negated guard: applies to every profile except prod.
spring.config.activate.on-profile=!prod
log.level=DEBUG
