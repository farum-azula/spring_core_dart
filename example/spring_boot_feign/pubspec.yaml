name: spring_boot_feign_example
description: "Spring Boot against real public servers: a Feign client (REST, JSONPlaceholder), server-sent events (Wikimedia) and a WebSocket client (echo server)."
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# Only the starters: each brings spring_boot_dart, spring_core_dart,
# spring_web_dart and logging (the Feign request log:
# logging.level.feign=debug).
dependencies:
  spring_boot_starter_feign: ^0.3.1
  spring_boot_starter_websocket: ^0.3.1

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.3.1
  spring_core_dart_generator: ^0.3.1
  test: ^1.33.0
