name: spring_boot_feign_example
description: "Spring Boot against real public servers: a Feign client (REST, JSONPlaceholder), server-sent events (Wikimedia) and a WebSocket client (echo server)."
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.2.0
  spring_boot_starter_feign: ^0.2.0
  spring_boot_starter_websocket: ^0.2.0
  # Console logging, and the Feign request log (logging.level.feign=debug).
  spring_boot_starter_logging: ^0.2.0
  spring_core_dart: ^0.2.0

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.2.0
  spring_core_dart_generator: ^0.2.0
  # MockHttpTransport, MockWebSocketTransport.
  spring_web_dart: ^0.2.0
  test: ^1.33.0
