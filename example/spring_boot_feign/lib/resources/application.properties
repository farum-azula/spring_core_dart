spring.application.name=spring-boot-feign-example

# The real public API (https://jsonplaceholder.typicode.com): a free fake
# REST API, no key needed.
jsonplaceholder.url=https://jsonplaceholder.typicode.com

# Feign: how long a call may take, and a log line per request.
spring.cloud.openfeign.client.config.jsonplaceholder.read-timeout=15s
spring.cloud.openfeign.client.config.jsonplaceholder.logger-level=basic

# spring_boot_starter_logging: the Feign log is written at debug level.
logging.level.root=info
logging.level.feign=debug
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%logger] %m
