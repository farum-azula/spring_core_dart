spring.application.name=spring-boot-feign-example

# The real public API (https://jsonplaceholder.typicode.com): a free fake
# REST API, no key needed.
jsonplaceholder.url=https://jsonplaceholder.typicode.com

# Feign: the longest wait for data (read timeout, 60s by default), and a
# log line per request.
spring.cloud.openfeign.client.config.jsonplaceholder.read-timeout=15s
spring.cloud.openfeign.client.config.jsonplaceholder.logger-level=basic

# Server-sent events: every edit on Wikimedia wikis
# (https://stream.wikimedia.org). Wikimedia asks for a User-Agent naming
# the client. For event streams the read timeout covers the headers only.
wikimedia.url=https://stream.wikimedia.org
wikimedia.user-agent=spring-boot-feign-example/0.1 (https://github.com/farum-azula/spring_core_dart)
spring.cloud.openfeign.client.config.wikimedia.read-timeout=15s
spring.cloud.openfeign.client.config.wikimedia.logger-level=basic

# WebSocket: Postman's public echo server.
echo.url=wss://ws.postman-echo.com/raw
spring.websocket.client.config.echo.connect-timeout=10s

# spring_boot_starter_logging: the Feign log is written at debug level.
logging.level.root=info
logging.level.feign=debug
logging.level.websocket=debug
logging.pattern.console=%d{HH:mm:ss.SSS} %5p [%logger] %m
