name: static_site_app
description: "A small Flutter web site served by its own Spring server (../server): the build is static files, the API on the same origin."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # The pages (@ScreenRoute), their Markdown (RouteContentView), the
  # browser's addresses. It brings and exports the Flutter starter (the app
  # widget and theme from properties, MarkdownView, and spring_web_dart's
  # HttpTransport for the request to the server's /api/info).
  spring_boot_starter_flutter_navigation: ^0.8.0
  # Material Design for the app (spring.flutter.app.type: material): the
  # MaterialApp and the palette of the theme's seed color.
  spring_boot_starter_flutter_material: ^0.8.0
  # Material's widgets (Scaffold, AppBar, ...), which the pages import.
  material_ui: ^1.11.0

dev_dependencies:
  build_runner: ^2.17.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.0
  spring_core_dart_generator: ^0.8.0

flutter:
  uses-material-design: true
