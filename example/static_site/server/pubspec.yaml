name: static_site_server
description: "The server of the static site example: the files of the Flutter web build (../app) and an API, on one port."
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# The starter alone: it brings spring_boot_dart, spring_core_dart,
# spring_web_dart and the logging starter, and exports them.
dependencies:
  spring_boot_starter_web: ^0.7.4

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.7.4
  spring_core_dart_generator: ^0.7.4
  test: ^1.33.0
