name: spring_security_core
description: >-
  Spring Security for Dart: the security context, users, password encoders (Argon2, PBKDF2, scrypt) and method security with @PreAuthorize on bean methods.
version: 0.5.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_security_core
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - security
  - authentication
  - authorization
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # THIRD-PARTY, to be removed (docs/dependencies.md, "pointycastle"):
  # Bouncy Castle's Dart port, Argon2, PBKDF2 and scrypt of the password
  # encoders. Used only by lib/src/crypto/kdf_primitives.dart.
  pointycastle: ^4.0.0
  spring_boot_dart: ^0.5.0
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.5.0

dev_dependencies:
  # For example/ and test/app/: the generator writes the *.spring.dart files.
  build_runner: ^2.17.0
  # The tests check that method security runs before @Cacheable.
  spring_boot_starter_cache: ^0.5.0
  spring_boot_starter_test: ^0.5.0
  spring_core_dart_generator: ^0.5.0
  test: ^1.33.0
