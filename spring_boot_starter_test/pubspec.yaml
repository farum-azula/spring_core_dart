name: spring_boot_starter_test
description: >-
  Testing support for spring_boot_dart applications and starters: springBootTest (like @SpringBootTest), bean overrides for fakes and mocks, ApplicationContextRunner, bean matchers and log capture. Works with package:test and flutter_test.
version: 0.1.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_test
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - dependency-injection
  - testing
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

# test_api + matcher (not package:test), so flutter_test projects resolve.
dependencies:
  matcher: ^0.12.16
  spring_boot_dart: ^0.1.0
  test_api: ">=0.7.0 <0.8.0"

dev_dependencies:
  test: ^1.33.0
