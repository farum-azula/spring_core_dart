name: spring_boot_starter_test
description: >-
  Testing for spring_boot_dart apps and starters: springBootTest, bean overrides for mocks, ApplicationContextRunner, matchers and log capture. Works with flutter_test.
version: 0.3.1
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_test
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - dependency-injection
  - testing
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

# test_api + matcher (not package:test), so flutter_test projects resolve.
dependencies:
  matcher: ^0.12.16
  spring_boot_dart: ^0.3.1
  # MockHttpTransport, MockWebSocketTransport (re-exported), like the
  # MockRestServiceServer of spring-test.
  spring_web_dart: ^0.3.1
  test_api: ">=0.7.0 <0.8.0"

dev_dependencies:
  test: ^1.33.0
