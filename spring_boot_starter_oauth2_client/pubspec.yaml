name: spring_boot_starter_oauth2_client
description: >-
  OAuth 2.0 and OpenID Connect clients for spring_boot_dart: registrations from spring.security.oauth2.client.*, every grant, token refresh, Bearer tokens on Feign calls.
version: 0.4.2
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_oauth2_client
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - oauth2
  - openid-connect
  - security
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

# Test keys, made for the tests and used nowhere else: not leaked secrets.
false_secrets:
  - /test/jwt_client_secret_test.dart

dependencies:
  # THIRD-PARTY, to be removed (docs/dependencies.md, "pointycastle"):
  # Bouncy Castle's Dart port, SHA-256 (PKCE, the OpenID Connect nonce,
  # DPoP) and ES256 signing of the software DPoP key. Used only by
  # lib/src/core/crypto_primitives.dart. It comes with spring_security_core
  # anyway.
  pointycastle: ^4.0.0
  spring_boot_dart: ^0.4.2
  spring_boot_starter_feign: ^0.4.2
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.4.2
  spring_security_core: ^0.4.2
  spring_web_dart: ^0.4.2

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.4.2
  spring_core_dart_generator: ^0.4.2
  test: ^1.33.0
