name: spring_boot_starter_flutter_navigation
description: >-
  Navigation for Spring Boot Flutter apps: screens on routes with Spring's path patterns, shells with a stack per branch, RouteTemplate, the route and branch scopes, deep links.
version: 0.8.1
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_flutter_navigation
documentation: https://farum-azula.org/components
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - flutter
  - navigation
  - router
  - spring

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  # The web's path URL strategy (no `#` in the address).
  flutter_web_plugins:
    sdk: flutter
  spring_boot_dart: ^0.8.1
  # Re-exported: an app lists only this package.
  spring_boot_starter_flutter: ^0.8.1
  # PathPattern: the routes' paths, the syntax of the web starter.
  spring_web_dart: ^0.8.1

dev_dependencies:
  # For example/ and the typed properties (lib/src/properties/).
  build_runner: ^2.17.0
  spring_core_dart_generator: ^0.8.1
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.1
  # For the tests in a Material and in a Cupertino app only: the package
  # itself depends on no design library.
  spring_boot_starter_flutter_material: ^0.8.1
  spring_boot_starter_flutter_cupertino: ^0.8.1
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  lints: ^6.0.0
