name: spring_boot_starter_scheduling
description: >-
  Scheduling starter for spring_boot_dart: @Scheduled methods with fixed rate, fixed delay or cron expressions, a TaskScheduler bean, stopped with the context.
version: 0.4.3
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_scheduling
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - scheduling
  - cron
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # The current time that fake_async and Flutter widget tests fake along
  # with the timers (the Dart team's package, tools.dart.dev).
  clock: ^1.1.2
  spring_boot_dart: ^0.4.3
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.4.3

dev_dependencies:
  # For example/: the generator writes example/example.spring.dart.
  build_runner: ^2.17.0
  # Fake timers and a fake clock, as in a Flutter widget test (the Dart
  # team's package).
  fake_async: ^1.3.3
  spring_boot_starter_test: ^0.4.3
  spring_core_dart_generator: ^0.4.3
  test: ^1.33.0
