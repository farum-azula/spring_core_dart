name: spring_boot_starter_flutter
description: >-
  Spring Boot for Flutter apps: SpringApplicationWidget, beans in widgets, state beans that rebuild widgets, lifecycle, platform profiles, themes from properties.
version: 0.5.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_flutter
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - dependency-injection
  - flutter
  - spring

environment:
  sdk: ^3.13.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.3
  spring_boot_dart: ^0.5.0
  spring_boot_starter_logging: ^0.5.0

dev_dependencies:
  # For example/: the generator writes example/example.spring.dart.
  build_runner: ^2.17.0
  spring_core_dart_generator: ^0.5.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.5.0
  lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
