name: spring_boot_starter_flutter
description: >-
  Spring Boot for Flutter apps: SpringApplicationWidget starts the app, beans in widgets (context.bean, generated getters, SpringStatelessWidget), lifecycle, platform profiles.
version: 0.3.2
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_flutter
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - dependency-injection
  - flutter
  - spring

environment:
  sdk: ^3.13.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  spring_boot_dart: ^0.3.2
  spring_boot_starter_logging: ^0.3.2

dev_dependencies:
  # For example/: the generator writes example/example.spring.dart.
  build_runner: ^2.17.0
  spring_core_dart_generator: ^0.3.2
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.3.2
  lints: ^6.0.0
