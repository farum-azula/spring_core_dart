id = "dart-spring"
name = "dart_spring"
description = "Spring for Dart and Flutter (spring_core_dart, spring_boot_dart): navigation from injection points to beans and from @Value to properties, SpEL highlighting and checks, snippets (Dart, and themes in YAML and .properties)."
# Always the version of the spring_core_dart family it supports
# (set by tool/version.dart together with the packages).
version = "0.3.1"
schema_version = 1
authors = ["NeonMaliket"]
repository = "https://github.com/farum-azula/spring_core_dart"
snippets = [
  "./snippets/dart.json",
  "./snippets/yaml.json",
  "./snippets/properties.json",
]

[language_servers.dart-spring]
name = "dart_spring"
languages = ["Dart"]
