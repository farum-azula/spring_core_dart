name: flutter_spring_language_server
description: >-
  Language server behind the flutter_spring editor extensions: navigation from injection points to beans and from @Value placeholders to properties, SpEL highlighting and checks.
version: 0.1.2
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

executables:
  flutter_spring_lsp:

dependencies:
  analyzer: ">=14.0.0 <15.0.0"
  spring_core_dart: ^0.1.2

dev_dependencies:
  test: ^1.33.0
