name: dart_spring_language_server
description: >-
  Language server behind the dart_spring editor extensions: navigation from injection points to beans (also those of dependencies) and from @Value placeholders to properties, completion, hovers and checks for config keys, the theme and SpEL beans from the Spring metadata, SpEL and pointcut highlighting and checks; creates Spring Boot projects.
version: 0.6.3
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

executables:
  dart_spring_lsp:

dependencies:
  analyzer: ">=14.0.0 <15.0.0"
  spring_boot_dart: ^0.6.3
  spring_core_dart: ^0.6.3
  # Only lib/query_syntax.dart: the SQL lexer and the derived query grammar.
  spring_core_dart_generator: ^0.6.3
  yaml: ^3.1.0

dev_dependencies:
  test: ^1.33.0
