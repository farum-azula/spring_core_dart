# Two files that a @DataTest never opens (it replaces both with in-memory
# databases) and no test may create; there are no migrations, so the tests
# get the tables of the entities.
spring.datasource.url=sqlite:file:build/data_test_mixed_app.db
spring.datasources.archive.url=sqlite:file:build/data_test_mixed_archive.db
spring.main.banner-mode=off
