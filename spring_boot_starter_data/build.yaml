# The generator writes the example's application (example/example.spring.dart),
# the applications of the tests, and the bootstrap of the @DataTest classes
# (test/spring/data_test/*.test.spring.dart); the package itself is written by
# hand.
targets:
  $default:
    builders:
      spring_core_dart_generator:spring_core_dart:
        generate_for:
          - example/**
          - test/transaction/app/**
          - test/integration/app/**
          - test/sqlite/app/**
          - test/postgres/app/**
          - test/autoconfig/app/**
          - test/repository/jdbc/app/**
          - test/data_test/app/**
          - test/data_test/create_app/**
          - test/data_test/memory_app/**
          - test/data_test/mixed_app/**
      spring_core_dart_generator:spring_test:
        generate_for:
          - test/data_test/**
