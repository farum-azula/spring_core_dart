# The database of the example: SQLite, in a file next to where it runs.
# Tests and other runs override it (--spring.datasource.url=...); without
# this property the repositories use the in-memory store.
spring.datasource.url=sqlite:file:library.db

# The SQL of each statement, as Spring Boot's spring.jpa.show-sql does.
spring.data.jdbc.show-sql=true
