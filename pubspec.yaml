name: spring_core_dart_workspace
description: "spring_core_dart: Spring Core for Dart."
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - spring_core_dart
  - spring_core_dart_generator
  - spring_boot_dart
  - spring_boot_starter_test
  - spring_boot_starter_logging
  - example

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.9.0

melos:
  scripts:
    gen:
      description: Regenerate *.beans.dart in packages that use the generator.
      exec: dart run build_runner build
      packageFilters:
        dependsOn: build_runner
    analyze:
      exec: dart analyze .
    format:
      exec: dart format --set-exit-if-changed .
    test:
      description: Tests of every workspace package, from each package and from the root.
      run: dart run tool/test_all.dart
    coverage:
      description: Line coverage into coverage/lcov.info of each package.
      exec: dart run coverage:test_with_coverage
      packageFilters:
        dependsOn: coverage
    version:
      description: "Lockstep version for the whole family: melos run version -- 0.2.0"
      run: dart run tool/version.dart
    check:versions:
      description: Every package has the same version and sibling constraints.
      run: dart run tool/version.dart --check
    check:
      description: gen + analyze + format + test.
      steps:
        - check:versions
        - gen
        - analyze
        - format
        - test
