name: spring_boot_starter_logging
description: >-
  Logging starter for spring_boot_dart: console patterns, log files with rollover, logging.* properties and an in-memory log buffer for in-app log viewers.
version: 0.2.1
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_logging
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - logging
  - configuration
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.2.1

dev_dependencies:
  spring_boot_starter_test: ^0.2.1
  test: ^1.33.0
