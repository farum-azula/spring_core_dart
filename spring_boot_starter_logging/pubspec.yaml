name: spring_boot_starter_logging
description: >-
  Logging for spring_boot_dart applications: console output with patterns, levels from properties, and an in-memory log buffer with filtering and streams for an in-app log viewer (Flutter).
version: 0.1.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_logging
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - logging
  - configuration
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.1.0

dev_dependencies:
  spring_boot_starter_test: ^0.1.0
  test: ^1.33.0
