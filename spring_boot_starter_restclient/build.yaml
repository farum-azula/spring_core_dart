# The generator writes the example's application (example/spring_gen/example.spring.dart),
# the applications the retry and HTTP service tests start (test/resilience/app/,
# test/http_services/app/) and, with `spring_properties`, the binding of the typed properties
# (lib/src/config/); the rest of the package is written by hand.
targets:
  $default:
    builders:
      spring_core_dart_generator:spring_core_dart:
        generate_for:
          - example/**
          - test/resilience/app/**
          - test/http_services/app/**
      spring_core_dart_generator:spring_properties:
        enabled: true
        generate_for: [lib/src/config/**]
      spring_core_dart_generator:spring_test:
        enabled: false
