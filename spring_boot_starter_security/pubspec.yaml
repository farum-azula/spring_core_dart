name: spring_boot_starter_security
description: >-
  Spring Security for the web starter: a filter chain configured with HttpSecurity, HTTP Basic, form login, sessions, CSRF, CORS, security headers, JWT resource servers.
version: 0.7.1
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_security
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - security
  - authentication
  - jwt
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # THIRD-PARTY, to be removed (docs/dependencies.md, "pointycastle"):
  # Bouncy Castle's Dart port, RSA and ECDSA signatures of JWTs. Used only
  # by lib/src/jwt/signature_primitives.dart.
  pointycastle: ^4.0.0
  # EndpointRequest and the roles of the actuator's `when-authorized`: the
  # actuator's model only (no endpoint, no auto-configuration).
  spring_boot_actuator: ^0.7.1
  spring_boot_dart: ^0.7.1
  # oauth2Login(): the registrations, the token endpoint, the users and
  # the authorized clients (re-exported, with the Feign starter it brings).
  spring_boot_starter_oauth2_client: ^0.7.1
  spring_boot_starter_web: ^0.7.1
  spring_security_core: ^0.7.1
  # MockServerHttpRequest and RequestPostProcessor of testing.dart.
  spring_web_dart: ^0.7.1

dev_dependencies:
  # For example/ and test/app/: the generator writes the *.spring.dart files.
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.7.1
  # WebSocket endpoints behind the security chain (test/websocket_test.dart).
  spring_boot_starter_websocket: ^0.7.1
  spring_core_dart_generator: ^0.7.1
  test: ^1.33.0
