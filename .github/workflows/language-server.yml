name: 'Release: language server binaries'

# Builds the dart_spring language server (extensions/language_server) as
# native executables and attaches them to the GitHub release of the tag, where
# the editor extensions download them (the Zed extension takes the release of
# its own version):
#
#   dart_spring_lsp-macos-arm64.tar.gz
#   dart_spring_lsp-linux-x64.tar.gz
#   dart_spring_lsp-linux-arm64.tar.gz
#   dart_spring_lsp-windows-x64.zip
#
# Runs for every `vX.Y.Z` tag (pushed by the "Release" workflow), or by hand
# (Run workflow) to rebuild the server from the selected branch and replace
# the binaries of a release without releasing the packages again.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the binaries to (e.g. v0.1.2)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: dart_spring_lsp-macos-arm64.tar.gz
            target: ''
          - runner: ubuntu-26.04
            asset: dart_spring_lsp-linux-x64.tar.gz
            target: ''
          - runner: ubuntu-26.04
            asset: dart_spring_lsp-linux-arm64.tar.gz
            target: --target-os=linux --target-arch=arm64
          - runner: windows-latest
            asset: dart_spring_lsp-windows-x64.zip
            target: ''
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Compile
        shell: bash
        run: |
          mkdir -p out
          name=dart_spring_lsp
          if [[ "${{ matrix.asset }}" == *.zip ]]; then name=dart_spring_lsp.exe; fi
          dart compile exe ${{ matrix.target }} \
            extensions/language_server/bin/dart_spring_lsp.dart -o "out/$name"

      - name: Archive
        shell: bash
        run: |
          cd out
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            7z a "../${{ matrix.asset }}" dart_spring_lsp.exe
          else
            tar -czf "../${{ matrix.asset }}" dart_spring_lsp
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Upload (create the release if needed)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" \
              --notes "Packages: https://pub.dev/packages/spring_core_dart — language server binaries for the dart_spring editor extensions are attached."
          fi
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
