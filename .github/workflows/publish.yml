name: 'Release: publish to pub.dev'

# Step 2 of a release: runs when a `v<version>` tag is pushed (by the
# "Release" workflow or by hand) and publishes every package as its own job,
# dependencies first, so each package's progress is visible:
#
#   tests → spring_core_dart → spring_core_dart_generator, spring_boot_dart,
#           spring_web_dart
#         → spring_boot_starter_logging, spring_boot_starter_scheduling,
#           spring_boot_starter_cache, spring_boot_starter_feign,
#           spring_boot_starter_websocket, spring_boot_starter_test
#         → spring_boot_starter_flutter (with the Flutter SDK)
#
# No password or token: pub.dev trusts this repository through GitHub's
# OpenID Connect token once automated publishing is enabled on each package's
# admin page (repository farum-azula/spring_core_dart, tag pattern
# `v{{version}}`). Versions already on pub.dev are skipped, so a failed run
# can simply be re-run.
#
# A package that is not on pub.dev yet is skipped with a warning (pub.dev
# lets only a person publish a package's first version): the rest is
# published, and the run's summary says to publish the new ones with
# `git checkout v<version> && dart run tool/publish.dart`.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/test_all.dart --packages

  core:
    name: Publish spring_core_dart
    needs: tests
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # the OIDC token pub.dev accepts
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/publish.dart --package spring_core_dart

  on-core:
    name: Publish ${{ matrix.package }}
    needs: core
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [spring_core_dart_generator, spring_boot_dart, spring_web_dart]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/publish.dart --package ${{ matrix.package }}

  starters:
    name: Publish ${{ matrix.package }}
    needs: on-core
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - spring_boot_starter_logging
          - spring_boot_starter_scheduling
          - spring_boot_starter_cache
          - spring_boot_starter_feign
          - spring_boot_starter_websocket
          - spring_boot_starter_test
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/publish.dart --package ${{ matrix.package }}

  # spring_boot_starter_flutter needs the Flutter SDK; it is outside the pub workspace,
  # so without its pubspec_overrides.yaml it resolves the family versions
  # just published above.
  flutter:
    name: Publish spring_boot_starter_flutter
    needs: starters
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Sets up pub.dev's OpenID Connect token, which `flutter pub` uses too.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: dart pub get
      - name: Tests against the published family
        working-directory: spring_boot_starter_flutter
        run: |
          rm pubspec_overrides.yaml
          flutter pub get
          flutter test
      - run: dart run tool/publish.dart --package spring_boot_starter_flutter
