name: CI

# Tests and checks on main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: dart pub get

      - name: Lockstep versions and pubspec descriptions
        run: dart run tool/version.dart --check

      - name: Dependencies only from this repository and the Dart team
        run: dart run tool/check_dependencies.dart

      - name: Zed extension dart_spring builds
        working-directory: extensions/zed/dart_spring
        run: |
          jq empty snippets/dart.json
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2

      - name: Language server compiles to a native executable
        run: dart compile exe extensions/language_server/bin/dart_spring_lsp.dart -o /tmp/dart_spring_lsp

      - name: Generated code is up to date
        working-directory: example/spring_core_tour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      # The app itself is not run here (it calls real public servers); its
      # tests run with all the others, against local servers.
      - name: Generated code is up to date (Spring Boot + Feign example)
        working-directory: example/spring_boot_feign
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      - name: Analyze
        run: dart analyze --fatal-infos spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_web_dart spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_test example/spring_core_tour example/spring_boot_feign extensions/language_server tool

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # Every workspace package (runtime, generator, Boot, starters, example),
      # read from the root pubspec.yaml: from each package directory and from
      # the workspace root (IDEs run tests from there).
      - name: Tests of all packages
        run: dart run tool/test_all.dart

      # SpEL and the JSON mapper run on the web too, where an integral
      # double is an `int` at run time: their tests also run compiled to
      # JavaScript, on node.
      - name: SpEL and JSON tests on node
        working-directory: spring_core_dart
        run: dart test -p node test/expression test/json

      - name: Example runs (tour and Spring Boot app)
        working-directory: example/spring_core_tour
        run: |
          dart run bin/main.dart
          # @Scheduled tasks keep a Boot app running; switched off to exit.
          dart run bin/shop.dart --spring.task.scheduling.enabled=false

      - name: Release-mode check (minified JavaScript)
        working-directory: example/spring_core_tour
        run: |
          dart compile js -O4 -o /tmp/release_check.js tool/release_check.dart
          # dart2js code expects the browser's `self` (timers of @Scheduled).
          node -e 'globalThis.self = globalThis; require("/tmp/release_check.js")'

  # spring_boot_starter_flutter and the Flutter example: outside the pub workspace
  # (flutter_test pins versions that package:test of the workspace cannot
  # use), so they get the Flutter SDK and their own resolution.
  flutter:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd spring_boot_starter_flutter && flutter pub get)
          (cd example/flutter_counter && flutter pub get)

      - name: Dependencies only from this repository and the Dart / Flutter teams
        run: dart run tool/check_dependencies.dart --flutter

      - name: Generated code is up to date (Flutter example)
        working-directory: example/flutter_counter
        run: |
          dart run build_runner build
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      - name: Analyze
        run: |
          (cd spring_boot_starter_flutter && flutter analyze --fatal-infos)
          (cd example/flutter_counter && flutter analyze --fatal-infos)

      # The golden screenshots run in the `goldens` job (macOS).
      - name: Tests
        run: |
          (cd spring_boot_starter_flutter && flutter test)
          (cd example/flutter_counter && flutter test --exclude-tags golden)

      - name: The example builds for the web (release)
        working-directory: example/flutter_counter
        run: flutter build web --release

  # The golden screenshots of the Flutter example (test/golden_test.dart):
  # made on macOS, so compared on macOS; Linux draws the letters
  # differently (0.5–3% of the pixels of a screen with text).
  goldens:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd example/flutter_counter && flutter pub get)

      - name: Golden screenshots
        working-directory: example/flutter_counter
        run: flutter test --tags golden

      # The screenshots that no longer match: the expected and actual images
      # and their difference.
      - name: Golden differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: example/flutter_counter/test/failures/
          if-no-files-found: ignore

  # The lowest versions allowed by our constraints must still work: resolve
  # them and analyze (transitive test tooling at its minimum does not run on
  # the current SDK, so only the analysis is checked here).
  minimum-versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub downgrade
      - run: dart analyze spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_web_dart spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_test
