name: CI

# Tests and checks on main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Which packages the change affects (tool/affected.dart): those with
  # changed files and their dependents; the tests below run only for them.
  # Shared files (tool/, root pubspec, CI) affect everything, docs nothing.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      core: ${{ steps.affected.outputs.core }}
      tour: ${{ steps.affected.outputs.tour }}
      flutter: ${{ steps.affected.outputs.flutter }}
      flutter_starter: ${{ steps.affected.outputs.flutter_starter }}
      flutter_counter: ${{ steps.affected.outputs.flutter_counter }}
      flutter_themes: ${{ steps.affected.outputs.flutter_themes }}
      flutter_examples: ${{ steps.affected.outputs.flutter_examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # A pull request: its changes since it left the base branch. A push:
      # the pushed commits (a new branch or a force push: everything).
      - name: Affected packages
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: dart run tool/affected.dart --base "$BASE" --github-output

  check:
    needs: changes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: dart pub get

      - name: Lockstep versions and pubspec descriptions
        run: dart run tool/version.dart --check

      - name: Dependencies only from this repository and the Dart team
        run: dart run tool/check_dependencies.dart

      # tool/affected.dart, version.dart and release.dart, and the docs'
      # install snippets (roadmap/dependencies.md).
      - name: Tests of the tools
        run: dart test tool/test

      # An application per starter that lists only that starter: generator,
      # analyze --fatal-infos (depend_on_referenced_packages) and its tests.
      - name: Each starter is an application's only dependency
        run: dart run tool/check_app_dependencies.dart

      - name: Zed extension dart_spring builds
        working-directory: extensions/zed/dart_spring
        run: |
          jq empty snippets/dart.json
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2

      - name: Language server compiles to a native executable
        run: dart compile exe extensions/language_server/bin/dart_spring_lsp.dart -o /tmp/dart_spring_lsp

      - name: Generated code is up to date
        working-directory: example/spring_core_tour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      # The app itself is not run here (it calls real public servers); its
      # tests run with all the others, against local servers.
      # The packages' own examples (example/example.dart on pub.dev) are
      # Spring Boot applications written by the generator.
      - name: Generated code is up to date (package examples)
        run: |
          for package in spring_core_dart spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_boot_starter_feign spring_boot_starter_websocket; do
            (cd $package && dart run build_runner build)
            git diff --exit-code -- $package
            test -z "$(git status --porcelain -- $package)"
          done

      - name: Generated code is up to date (Spring Boot + Feign example)
        working-directory: example/spring_boot_feign
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      - name: Analyze
        run: dart analyze --fatal-infos spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_web_dart spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_test example/spring_core_tour example/spring_boot_feign extensions/language_server tool

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # The affected workspace packages (all of them after a change to a
      # shared file): from each package directory and from the workspace
      # root (IDEs run tests from there).
      - name: Tests of the affected packages
        if: needs.changes.outputs.packages != ''
        run: dart run tool/test_all.dart --only "${{ needs.changes.outputs.packages }}"

      # SpEL and the JSON mapper run on the web too, where an integral
      # double is an `int` at run time: their tests also run compiled to
      # JavaScript, on node.
      - name: SpEL and JSON tests on node
        if: needs.changes.outputs.core == 'true'
        working-directory: spring_core_dart
        run: dart test -p node test/expression test/json

      - name: Example runs (tour and Spring Boot app)
        if: needs.changes.outputs.tour == 'true'
        working-directory: example/spring_core_tour
        run: |
          dart run bin/main.dart
          # @Scheduled tasks keep a Boot app running; switched off to exit.
          dart run bin/shop.dart --spring.task.scheduling.enabled=false

      - name: Release-mode check (minified JavaScript)
        if: needs.changes.outputs.tour == 'true'
        working-directory: example/spring_core_tour
        run: |
          dart compile js -O4 -o /tmp/release_check.js tool/release_check.dart
          # dart2js code expects the browser's `self` (timers of @Scheduled).
          node -e 'globalThis.self = globalThis; require("/tmp/release_check.js")'

  # spring_boot_starter_flutter and the Flutter example: outside the pub workspace
  # (flutter_test pins versions that package:test of the workspace cannot
  # use), so they get the Flutter SDK and their own resolution.
  # Only when spring_boot_starter_flutter or the Flutter example is affected.
  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd spring_boot_starter_flutter && flutter pub get)
          (cd example/flutter_counter && flutter pub get)
          (cd example/flutter_themes && flutter pub get)

      - name: Dependencies only from this repository and the Dart / Flutter teams
        run: dart run tool/check_dependencies.dart --flutter

      - name: Generated code is up to date (Flutter examples)
        run: |
          for example in example/flutter_counter example/flutter_themes spring_boot_starter_flutter; do
            (cd $example && dart run build_runner build)
            git diff --exit-code -- $example
            test -z "$(git status --porcelain -- $example)"
          done

      - name: Analyze
        run: |
          (cd spring_boot_starter_flutter && flutter analyze --fatal-infos)
          (cd example/flutter_counter && flutter analyze --fatal-infos)
          (cd example/flutter_themes && flutter analyze --fatal-infos)

      # The golden screenshots run in the `goldens` job (macOS).
      - name: Tests of spring_boot_starter_flutter
        if: needs.changes.outputs.flutter_starter == 'true'
        working-directory: spring_boot_starter_flutter
        run: flutter test

      - name: Tests of the Flutter counter example
        if: needs.changes.outputs.flutter_counter == 'true'
        working-directory: example/flutter_counter
        run: flutter test --exclude-tags golden

      - name: Tests of the Flutter themes example
        if: needs.changes.outputs.flutter_themes == 'true'
        working-directory: example/flutter_themes
        run: flutter test --exclude-tags golden

      - name: The example builds for the web (release)
        working-directory: example/flutter_counter
        run: flutter build web --release

  # The golden screenshots of the Flutter examples (test/golden_test.dart):
  # made on macOS, so compared on macOS; Linux draws the letters
  # differently (0.5–3% of the pixels of a screen with text).
  goldens:
    needs: changes
    if: needs.changes.outputs.flutter_examples == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd example/flutter_counter && flutter pub get)
          (cd example/flutter_themes && flutter pub get)

      - name: Golden screenshots (counter)
        if: needs.changes.outputs.flutter_counter == 'true'
        working-directory: example/flutter_counter
        run: flutter test --tags golden

      - name: Golden screenshots (themes)
        if: needs.changes.outputs.flutter_themes == 'true'
        working-directory: example/flutter_themes
        run: flutter test --tags golden

      # The screenshots that no longer match: the expected and actual images
      # and their difference.
      - name: Golden differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: example/flutter_*/test/failures/
          if-no-files-found: ignore

  # The lowest versions allowed by our constraints must still work: resolve
  # them and analyze (transitive test tooling at its minimum does not run on
  # the current SDK, so only the analysis is checked here).
  minimum-versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub downgrade
      - run: dart analyze spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_web_dart spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_test
