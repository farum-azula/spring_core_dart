name: CI

# Tests and checks on main (development) and on release (before a release).
on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: dart pub get

      - name: Lockstep versions (packages and editor extensions)
        run: dart run tool/version.dart --check

      - name: Zed extension flutter_spring builds
        working-directory: extensions/zed/flutter_spring
        run: |
          jq empty snippets/dart.json
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2

      - name: Language server compiles to a native executable
        run: dart compile exe extensions/language_server/bin/flutter_spring_lsp.dart -o /tmp/flutter_spring_lsp

      - name: Generated code is up to date
        working-directory: example
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      - name: Analyze
        run: dart analyze --fatal-infos spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_test example extensions/language_server tool

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # Every workspace package (runtime, generator, Boot, starters, example),
      # read from the root pubspec.yaml: from each package directory and from
      # the workspace root (IDEs run tests from there).
      - name: Tests of all packages
        run: dart run tool/test_all.dart

      - name: Example runs (tour and Spring Boot app)
        working-directory: example
        run: |
          dart run bin/main.dart
          dart run bin/shop.dart

      - name: Release-mode check (minified JavaScript)
        working-directory: example
        run: |
          dart compile js -O4 -o /tmp/release_check.js tool/release_check.dart
          node /tmp/release_check.js

  # The lowest versions allowed by our constraints must still work: resolve
  # them and analyze (transitive test tooling at its minimum does not run on
  # the current SDK, so only the analysis is checked here).
  minimum-versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub downgrade
      - run: dart analyze spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_test
