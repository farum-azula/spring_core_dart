name: CI

# Tests and checks on main and on pull requests.
#
# Independent jobs on separate machines, so the run takes about as long as
# its slowest job (not the sum of every step): static checks, generated
# code, the starters' applications, the unit tests in four parts, the
# integration tests (real sockets and processes), node/examples, Flutter.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run; every commit on main
# keeps its own run (the Release workflow looks at main's result).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which packages the change affects (tool/affected.dart): those with
  # changed files and their dependents; the tests below run only for them.
  # Shared files (tool/, root pubspec, CI) affect everything, docs nothing.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      core: ${{ steps.affected.outputs.core }}
      server_guide: ${{ steps.affected.outputs.server_guide }}
      security: ${{ steps.affected.outputs.security }}
      flutter: ${{ steps.affected.outputs.flutter }}
      flutter_starter: ${{ steps.affected.outputs.flutter_starter }}
      flutter_security: ${{ steps.affected.outputs.flutter_security }}
      flutter_guide: ${{ steps.affected.outputs.flutter_guide }}
      family: ${{ steps.affected.outputs.family }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # A pull request: its changes since it left the base branch. A push:
      # the pushed commits (a new branch or a force push: everything).
      - name: Affected packages
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: dart run tool/affected.dart --base "$BASE" --github-output

  # The quality gate (a required status check: keep the job's name):
  # formatting, the analyzer with very_good_analysis, and the tests of the
  # published Dart packages with line coverage that may not drop.
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # pubspec.lock is not committed: the cache is keyed on the pubspecs.
      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      # The Flutter guide is formatted in the `flutter` job: its
      # analysis_options.yaml includes flutter_lints, which only resolves
      # after `flutter pub get`; unresolved, the formatter drops the whole
      # file (trailing_commas: preserve too) and joins the bean columns.
      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' ':!:example/flutter_guide/**')

      # The workspace packages (the Flutter ones resolve outside it and are
      # analyzed by the `flutter` job).
      - name: Analyze
        run: dart analyze --fatal-infos spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_web_dart spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_web spring_security_core spring_boot_starter_oauth2_client spring_boot_starter_security spring_boot_starter_test example/server_guide extensions/language_server tool

      # coverage:test_with_coverage in each published Dart package, the
      # lcov files merged into coverage/lcov.info.
      - name: Tests with coverage
        run: |
          dart pub global activate coverage
          dart run tool/coverage.dart

      - name: Coverage does not drop
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          # The coverage of today (88.88 % of the lines, rounded down): it may
          # rise, not drop. Raise it when the coverage rises.
          min_coverage: 88

  # Known vulnerabilities of the resolved dependencies (a required status
  # check: keep the job's name), with Google's osv-scanner on the lock file
  # `dart pub get` writes. The Flutter packages' lock files are checked in
  # the `flutter` job (tool/check_vulnerabilities.dart --flutter).
  vulnerabilities:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          "$(go env GOPATH)/bin/osv-scanner" scan --lockfile=pubspec.lock

  # Fast checks of the whole repository (every change).
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Lockstep versions and pubspec descriptions
        run: dart run tool/version.dart --check

      - name: Dependencies only from this repository and the Dart team
        run: dart run tool/check_dependencies.dart

      # tool/affected.dart, test_all.dart, version.dart and release.dart,
      # and the docs' install snippets (roadmap/dependencies.md).
      - name: Tests of the tools
        run: dart test tool/test

      - name: Zed extension dart_spring builds
        working-directory: extensions/zed/dart_spring
        run: |
          jq empty snippets/dart.json
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2

      - name: Language server compiles to a native executable
        run: dart compile exe extensions/language_server/bin/dart_spring_lsp.dart -o /tmp/dart_spring_lsp

  # The generated code is committed: build_runner must not change it. The
  # tour app is not run here (it calls real public servers); its tests run
  # with all the others, against local servers. The packages' own examples
  # (example/example.dart on pub.dev) are Spring Boot applications written
  # by the generator. Two machines, about 2 minutes of builds each.
  generated:
    name: Generated code is up to date (${{ matrix.part }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: server guide and core
            directories: example/server_guide spring_core_dart spring_boot_dart
          - part: starters
            directories: spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_web spring_security_core spring_boot_starter_oauth2_client spring_boot_starter_security
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: build_runner build changes nothing
        env:
          DIRECTORIES: ${{ matrix.directories }}
        run: |
          for directory in $DIRECTORIES; do
            echo "::group::$directory"
            (cd $directory && dart run build_runner build)
            echo "::endgroup::"
            git diff --exit-code -- $directory
            test -z "$(git status --porcelain -- $directory)"
          done

  # An application per starter that lists only that starter: generator,
  # analyze --fatal-infos (depend_on_referenced_packages) and its tests.
  # The applications use every published Dart package of the family (by
  # path), so only when one of them is affected (tool/ changes: all).
  app-dependencies:
    name: Each starter is an application's only dependency
    needs: changes
    if: needs.changes.outputs.family == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - run: dart run tool/check_app_dependencies.dart

  # The affected workspace packages (all of them after a change to a shared
  # file), from each package directory and from the workspace root (IDEs
  # run tests from there), without the integration tests. tool/test_all.dart
  # deals the runs (both passes, the generator's shards) to four parts of
  # about the same weight, one per machine.
  test:
    name: Tests (part ${{ matrix.part }}/4)
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Tests of the affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
          PART: ${{ matrix.part }}
        run: dart run tool/test_all.dart --only "$PACKAGES" --exclude-tags "integration || differential" --job "$PART/4"

  # The tests tagged `integration` (@Tags(['integration'])): real HTTP and
  # WebSocket servers on sockets, started processes, the fetch transport on
  # node. Both passes, like the others.
  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: dart pub get

      - name: Integration tests of the affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: dart run tool/test_all.dart --only "$PACKAGES" --tags integration

  # The security starter against Spring Security itself
  # (roadmap/security_verification.md, section 3): the same raw requests to
  # the Spring Boot twin of its test application (tool/security_reference)
  # and to the Dart one; and password hashes written by each side, checked
  # by the other.
  differential:
    name: Security compared with Spring Security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: tool/security_reference/pom.xml

      - name: Install dependencies
        run: dart pub get

      - name: Build the Spring application
        working-directory: tool/security_reference
        run: mvn -B -q -DskipTests package

      - name: Spring checks the Dart password hashes
        run: |
          (cd spring_security_core && dart run test/vectors/write_password_hashes.dart /tmp/dart_password_hashes.json)
          cd tool/security_reference
          java -Dloader.main=dev.farumazula.reference.PasswordVectors \
            -cp target/security-reference-0.0.0.jar \
            org.springframework.boot.loader.launch.PropertiesLauncher \
            check /tmp/dart_password_hashes.json

      - name: The same requests to both
        working-directory: spring_boot_starter_security
        env:
          SECURITY_REFERENCE_REQUIRED: 'true' # no skipping without the jar
        run: dart test --tags differential --reporter expanded

  # OWASP ZAP's baseline scan of the server guide as the starter secures it
  # (roadmap/security_verification.md, section 6): the passive rules on
  # every endpoint (seeded by .zap/seed_hook.py: a JSON API has no links to
  # spider), logged in as `ada`: with the form login (dev), and with the
  # `sso` profile through the login of the Keycloak of example/keycloak.
  # Rules are accepted only in .zap/rules.tsv, with a reason; any other
  # warning fails.
  zap:
    name: OWASP ZAP baseline (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.security == 'true' || needs.changes.outputs.server_guide == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            profiles: dev
          - name: sso
            profiles: dev,sso
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      # The realm `neon` of example/keycloak (public development values).
      - name: Keycloak
        if: matrix.name == 'sso'
        run: |
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/example/keycloak/neon-realm.json:/opt/keycloak/data/import/neon-realm.json:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm --http-port=8180
          timeout 180 bash -c 'until curl -fs localhost:8180/realms/neon/.well-known/openid-configuration >/dev/null; do sleep 2; done'

      - name: Start the server guide
        working-directory: example/server_guide
        run: |
          dart run bin/main.dart --spring.profiles.active=${{ matrix.profiles }} \
            --spring.output.ansi.enabled=never > "$RUNNER_TEMP/server.log" 2>&1 &
          timeout 120 bash -c 'until curl -fs localhost:8080/api/books >/dev/null; do sleep 1; done'

      # The form login (dev): a session for the protected endpoints, with
      # the public development password of example/server_guide.
      - name: Log in as ada
        if: matrix.name == 'dev'
        run: |
          jar=$(mktemp)
          curl -fsS -c "$jar" -b "$jar" -o /dev/null localhost:8080/api/books
          xsrf=$(awk '$6 == "XSRF-TOKEN" { print $7 }' "$jar")
          curl -fsS -c "$jar" -b "$jar" -o /dev/null -X POST -H "X-XSRF-TOKEN: $xsrf" \
            -d 'username=ada&password=ada-secret' localhost:8080/api/login
          curl -fsS -b "$jar" -o /dev/null localhost:8080/api/me
          echo "ZAP_COOKIE=$(awk '$6 == "JSESSIONID" || $6 == "XSRF-TOKEN" { printf "%s=%s; ", $6, $7 }' "$jar")" >> "$GITHUB_ENV"

      # The single sign-on (sso): oauth2Login() through Keycloak's login
      # form, as a browser posts it, with the public development password
      # of example/keycloak. Keycloak answers the form with a redirect to
      # the server's callback, which logs the session in; its own redirect
      # (to the Flutter web app, not running here) is not followed.
      - name: Log in as ada at Keycloak
        if: matrix.name == 'sso'
        run: |
          jar=$(mktemp)
          form=$(curl -fsS -c "$jar" -b "$jar" -L localhost:8080/oauth2/authorization/keycloak)
          action=$(printf '%s' "$form" | grep -o 'action="[^"]*"' | head -n 1 \
            | sed -e 's/^action="//' -e 's/"$//' -e 's/&amp;/\&/g')
          callback=$(curl -fsS -c "$jar" -b "$jar" -o /dev/null -w '%{redirect_url}' \
            --data-urlencode username=ada --data-urlencode password=ada-secret "$action")
          curl -fsS -c "$jar" -b "$jar" -o /dev/null "$callback"
          curl -fsS -c "$jar" -b "$jar" -o /dev/null localhost:8080/api/me
          echo "ZAP_COOKIE=$(awk '$6 == "JSESSIONID" || $6 == "XSRF-TOKEN" { printf "%s=%s; ", $6, $7 }' "$jar")" >> "$GITHUB_ENV"

      # Without -I: a warning fails as a failure does. ZAP's image is
      # pinned, so a new rule arrives with a deliberate upgrade, not on its
      # own.
      - name: ZAP baseline
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && cp .zap/rules.tsv .zap/seed_hook.py "$RUNNER_TEMP/zap"
          chmod -R a+rwX "$RUNNER_TEMP/zap"
          docker run --rm --network host -e ZAP_COOKIE -v "$RUNNER_TEMP/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap-baseline.py \
            -t http://localhost:8080 -c rules.tsv --hook=/zap/wrk/seed_hook.py \
            -z '-config connection.timeoutInSecs=15' \
            -r report.html -J report.json -w report.md

      - name: ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-${{ matrix.name }}
          path: ${{ runner.temp }}/zap/report.*

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  # SpEL and the JSON mapper run on the web too, where an integral double is
  # an `int` at run time: their tests also run compiled to JavaScript, on
  # node. And the server guide runs, also minified.
  web:
    name: Node and the server guide
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.server_guide == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: dart pub get

      - name: SpEL and JSON tests on node
        if: needs.changes.outputs.core == 'true'
        working-directory: spring_core_dart
        run: dart test -p node test/expression test/json

      # The server itself is tested by its tests (the integration job starts
      # it on a free port); here the chapter 13 program runs to its end.
      - name: The server guide's advanced chapter runs
        if: needs.changes.outputs.server_guide == 'true'
        working-directory: example/server_guide
        run: dart run bin/advanced.dart

      - name: Release-mode check (minified JavaScript)
        if: needs.changes.outputs.server_guide == 'true'
        working-directory: example/server_guide
        run: |
          dart compile js -O4 -o /tmp/release_check.js tool/release_check.dart
          # dart2js code expects the browser's `self` (timers of @Scheduled).
          node -e 'globalThis.self = globalThis; require("/tmp/release_check.js")'

  # spring_boot_starter_flutter, spring_boot_starter_flutter_security and
  # the Flutter guide: outside the pub workspace (flutter_test pins versions
  # that package:test of the workspace cannot use), so they get the Flutter
  # SDK and their own resolution. Only when one of them, or the server guide
  # the Flutter guide talks to, is affected.
  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd spring_boot_starter_flutter && flutter pub get)
          (cd spring_boot_starter_flutter_security && flutter pub get)
          (cd example/flutter_guide && flutter pub get)

      - name: Dependencies only from this repository and the Dart / Flutter teams
        run: dart run tool/check_dependencies.dart --flutter

      - name: No known vulnerabilities in the dependencies (Flutter packages)
        run: dart run tool/check_vulnerabilities.dart --flutter

      # The Android build's own classpath (the Android and Kotlin Gradle
      # plugins and what they pull, constrained in the guide's
      # settings.gradle.kts and build.gradle.kts and the plugin's
      # build.gradle.kts): the build machine's, not the APK's. gradlew is
      # not committed (Flutter's android/.gitignore): --config-only writes
      # the wrapper without building.
      - name: No known vulnerabilities in the Android build's Gradle plugins
        run: |
          (cd example/flutter_guide && flutter build apk --config-only)
          (cd example/flutter_guide/android && ./gradlew -q -I ../../../tool/gradle/build_classpath.init.gradle help) > "$RUNNER_TEMP/classpath.txt"
          dart run tool/check_vulnerabilities.dart --maven "$RUNNER_TEMP/classpath.txt"

      - name: Generated code is up to date (Flutter guide and packages)
        run: |
          for example in example/flutter_guide spring_boot_starter_flutter spring_boot_starter_flutter_security; do
            (cd $example && dart run build_runner build)
            git diff --exit-code -- $example
            test -z "$(git status --porcelain -- $example)"
          done

      - name: Format (Flutter guide; the rest in the `quality` job)
        run: dart format --output=none --set-exit-if-changed example/flutter_guide

      - name: Analyze
        run: |
          (cd spring_boot_starter_flutter && flutter analyze --fatal-infos)
          (cd spring_boot_starter_flutter_security && flutter analyze --fatal-infos)
          (cd example/flutter_guide && flutter analyze --fatal-infos)

      # The golden screenshots run in the `goldens` job (macOS).
      - name: Tests of spring_boot_starter_flutter
        if: needs.changes.outputs.flutter_starter == 'true'
        working-directory: spring_boot_starter_flutter
        run: flutter test

      # The Dart side of the plugin (channels mocked) and the widgets; the
      # platform code runs in the Flutter guide's integration_test/ on a
      # device.
      - name: Tests of spring_boot_starter_flutter_security
        if: needs.changes.outputs.flutter_security == 'true'
        working-directory: spring_boot_starter_flutter_security
        run: flutter test

      # The app's tests, the end-to-end ones (tag e2e) against the server
      # guide running here.
      - name: Tests of the Flutter guide, against the server guide
        if: needs.changes.outputs.flutter_guide == 'true'
        run: |
          (cd example/server_guide && dart run bin/main.dart > "$RUNNER_TEMP/server.log" 2>&1 &)
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/api/books && break
            sleep 1
          done
          cd example/flutter_guide
          flutter test --exclude-tags golden || { cat "$RUNNER_TEMP/server.log"; exit 1; }

      - name: The Flutter guide builds for the web (release)
        if: needs.changes.outputs.flutter_guide == 'true'
        working-directory: example/flutter_guide
        run: flutter build web --release

  # The secret stores of Windows (DPAPI) and Linux (libsecret) against the
  # real systems (spring_boot_starter_flutter_security's
  # test/desktop_secret_store_test.dart): dart:ffi from the test's process,
  # no app built. Linux needs a Secret Service: GNOME Keyring, unlocked, in
  # a D-Bus session of its own. With DESKTOP_SECRET_STORE_REQUIRED the test
  # cannot skip.
  desktop-secret-stores:
    name: Secret stores on ${{ matrix.system }}
    needs: changes
    if: needs.changes.outputs.flutter_security == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            os: windows-latest
          - system: Linux
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_SECRET_STORE_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd spring_boot_starter_flutter_security && flutter pub get)

      - name: GNOME Keyring and libsecret
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus-x11 libglib2.0-bin

      - name: The DPAPI store
        if: runner.os == 'Windows'
        working-directory: spring_boot_starter_flutter_security
        run: flutter test test/desktop_secret_store_test.dart

      # The keyring daemon creates the login keyring with the password from
      # stdin and unlocks it, for this session only.
      - name: The libsecret store
        if: runner.os == 'Linux'
        working-directory: spring_boot_starter_flutter_security
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            flutter test test/desktop_secret_store_test.dart'

  # The golden screenshots of the Flutter guide (test/golden_test.dart):
  # made on macOS, so compared on macOS; Linux draws the letters
  # differently (0.5–3% of the pixels of a screen with text).
  goldens:
    needs: changes
    if: needs.changes.outputs.flutter_guide == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git --branch stable --depth 1 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          flutter --version
          dart pub get
          (cd example/flutter_guide && flutter pub get)

      - name: Golden screenshots of the Flutter guide
        working-directory: example/flutter_guide
        run: flutter test --tags golden

      # The screenshots that no longer match: the expected and actual images
      # and their difference.
      - name: Golden differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: example/flutter_guide/test/failures/
          if-no-files-found: ignore

  # The lowest versions allowed by our constraints must still work: resolve
  # them and analyze (transitive test tooling at its minimum does not run on
  # the current SDK, so only the analysis is checked here).
  minimum-versions:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub downgrade
      - run: dart analyze spring_core_dart spring_core_dart_generator spring_boot_dart spring_boot_starter_logging spring_boot_starter_scheduling spring_boot_starter_cache spring_web_dart spring_boot_starter_feign spring_boot_starter_websocket spring_boot_starter_web spring_security_core spring_boot_starter_oauth2_client spring_boot_starter_security spring_boot_starter_test
