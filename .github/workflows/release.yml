name: 'Release: bump version'

# Step 1 of a release. Releases come only from the `release` branch: merge
# main into it (a pull request main → release, or `git merge` + push).
# After CI passes there, this workflow bumps the version of every package
# (tool/release.dart), tests again, commits `chore(release): vX.Y.Z` on
# release, pushes the `vX.Y.Z` tag — which starts step 2, publish.yml
# ("Release: publish to pub.dev") — and merges the release commit back into
# main, so the next merge into release has no version conflicts.
#
# Pushes to main only run CI. The tag and the pushes use RELEASE_TOKEN: those
# made with the default GITHUB_TOKEN do not start other workflows.
#
# The release commit runs CI on release again; this workflow then finds no
# commits since the tag and stops, so there is no loop.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Bump versions and changelogs
        id: release
        run: dart run tool/release.dart

      # The new version can break tests that check it (e.g. compatibility
      # messages): test before tagging, so a failure leaves no tag behind.
      - name: Tests with the new version
        if: steps.release.outputs.version != ''
        run: dart run tool/test_all.dart --packages

      - name: Commit, tag and push
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:release
          git push origin "v$VERSION"

      # A conflict here (rare: both branches changed the same changelog
      # lines) stops the job; then merge release into main by hand.
      - name: Merge the release back into main
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff --no-edit "v$VERSION" \
            -m "chore(release): merge v$VERSION into main"
          git push origin main
