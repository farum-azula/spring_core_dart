name: 'Release'

# Step 1 of a release, started by hand: Actions → "Release" → Run workflow
# (on main), choosing the bump: `patch` (0.1.6 → 0.1.7) or `minor`
# (0.1.6 → 0.2.0, for breaking changes before 1.0.0); there is no major
# release. tool/release.dart sets the version of every package, turns the
# `## Unreleased` changelog sections into it, the tests run with it, and the
# commit `chore(release): vX.Y.Z` is pushed to main together with the tag
# `vX.Y.Z` — which starts step 2, publish.yml ("Release: publish to pub.dev").
#
# No release branch and no merges: main is the only branch, a release is a
# commit and a tag on it. Pushes to main only run CI. The push uses
# RELEASE_TOKEN: pushes made with the default GITHUB_TOKEN do not start
# other workflows (the tag must start publish.yml).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: patch (0.1.6 → 0.1.7) or minor (0.1.6 → 0.2.0, breaking changes)'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Bump versions and changelogs
        id: release
        run: dart run tool/release.dart --bump="${{ inputs.bump }}"

      # Test with the new version before tagging (tests may check it, e.g.
      # compatibility messages): a failure leaves no tag behind.
      - name: Tests with the new version
        if: steps.release.outputs.version != ''
        run: dart run tool/test_all.dart --packages

      # Atomic: the commit and the tag land together or not at all (e.g. when
      # main moved meanwhile; then run the workflow again).
      - name: Commit, tag and push
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "Nothing to release: no package changed since the last tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released v$VERSION: \"Release: publish to pub.dev\" publishes it now." >> "$GITHUB_STEP_SUMMARY"
          fi
