name: 'Release'

# Step 1 of a release, started by hand: Actions → "Release" → Run workflow
# (on main), choosing the bump: `patch` (0.1.6 → 0.1.7) or `minor`
# (0.1.6 → 0.2.0, for breaking changes before 1.0.0); there is no major
# release. tool/release.dart sets the version of every package, turns the
# `## Unreleased` changelog sections into it, the tests run with it, and the
# commit `chore(release): vX.Y.Z` is pushed to main together with the tag
# `vX.Y.Z` — which starts step 2, publish.yml ("Release: publish to pub.dev").
#
#   prepare: CI must not have failed on the commit; the bump, kept as a patch
#   tests:   the tests with the new version, in four parts (one machine each)
#   tag:     the same patch committed, tagged and pushed
#
# No release branch and no merges: main is the only branch, a release is a
# commit and a tag on it. Pushes to main only run CI. The push uses
# RELEASE_TOKEN: pushes made with the default GITHUB_TOKEN do not start
# other workflows (the tag must start publish.yml). publish.yml does not
# run the tests again when they passed here for the tagged commit.

# The bump is part of the run's name, so the list of runs shows what was
# chosen.
run-name: Release (${{ inputs.bump }})

on:
  workflow_dispatch:
    inputs:
      # No usable default: GitHub resets the inputs to their defaults when
      # the branch of the form is changed, so a default could be released by
      # mistake. "choose" fails the run.
      bump:
        description: 'Version bump: patch (0.1.6 → 0.1.7) or minor (0.1.6 → 0.2.0, breaking changes)'
        type: choice
        required: true
        default: choose
        options:
          - choose
          - patch
          - minor

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Bump versions and changelogs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # CI's result for the commit
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Commit to release
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A red main is not released (re-run CI when it was a flake). Still
      # running or no run: the tests below decide.
      - name: CI did not fail on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "none" else (.conclusion // .status) end')
          echo "CI on $SHA: $conclusion"
          case "$conclusion" in
            success) ;;
            failure|timed_out|startup_failure)
              echo "::error::CI failed on $SHA ($conclusion): fix main or re-run CI before releasing."
              exit 1 ;;
            *) echo "::warning::CI on $SHA: $conclusion; releasing on the tests of this workflow." ;;
          esac

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Bump versions and changelogs
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != patch ] && [ "$BUMP" != minor ]; then
            echo "::error::Choose the bump (patch or minor) in the Run workflow form."
            exit 1
          fi
          echo "Bump: $BUMP"
          dart run tool/release.dart --bump="$BUMP"
          git diff --binary > "$RUNNER_TEMP/release.patch"
          git diff --stat

      # The tests and the commit use exactly this change.
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.version != ''
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error

      - name: Summary
        if: steps.release.outputs.version == ''
        run: |
          echo "Nothing to release: no package changed since the last tag." >> "$GITHUB_STEP_SUMMARY"

  # Test with the new version before tagging (tests may check it, e.g.
  # compatibility messages): a failure leaves no tag behind. Every package,
  # from its directory, integration tests included (tool/test_all.dart
  # --packages), dealt to four machines.
  tests:
    name: Tests with the new version (part ${{ matrix.part }}/4)
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: release-patch
          path: ${{ runner.temp }}

      - run: git apply "$RUNNER_TEMP/release.patch"

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: Tests
        env:
          PART: ${{ matrix.part }}
        run: dart run tool/test_all.dart --packages --job "$PART/4"

  tag:
    name: Commit, tag and push
    needs: [prepare, tests]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: release-patch
          path: ${{ runner.temp }}

      # Atomic: the commit and the tag land together or not at all (e.g. when
      # main moved meanwhile; then run the workflow again).
      - name: Commit, tag and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git apply "$RUNNER_TEMP/release.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          echo "Released v$VERSION ($BUMP): \"Release: publish to pub.dev\" publishes it now." >> "$GITHUB_STEP_SUMMARY"
