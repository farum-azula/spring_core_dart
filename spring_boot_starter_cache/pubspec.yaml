name: spring_boot_starter_cache
description: >-
  Cache starter for spring_boot_dart: @Cacheable, @CachePut, @CacheEvict and @Caching on bean methods, SpEL keys, a CacheManager with TTL and size limits.
version: 0.5.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_cache
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - cache
  - caching
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.5.0
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.5.0

dev_dependencies:
  # For example/: the generator writes example/example.spring.dart.
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.5.0
  spring_core_dart_generator: ^0.5.0
  test: ^1.33.0
