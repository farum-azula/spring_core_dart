name: spring_boot_starter_flutter_cupertino
description: >-
  Cupertino for Spring Boot Flutter apps: a CupertinoApp from properties, a CupertinoThemeData from spring.flutter.theme, the iOS page route and its swipe back.
version: 0.8.1
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_flutter_cupertino
documentation: https://farum-azula.org/components
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - flutter
  - cupertino
  - theme
  - spring

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  # The iOS design: the Flutter team's library, which replaces
  # package:flutter/cupertino.dart.
  cupertino_ui: ^1.1.6
  # The Material 3 color math (pure Dart, the one material_ui uses): the
  # palette of a theme's seed-color, without Material's widgets.
  material_color_utilities: ^0.13.0
  spring_boot_dart: ^0.8.1
  # Re-exported: an app lists only this package.
  spring_boot_starter_flutter: ^0.8.1

dev_dependencies:
  # For example/: the generator writes example/spring_gen/example.spring.dart.
  build_runner: ^2.17.0
  spring_core_dart_generator: ^0.8.1
  flutter_test:
    sdk: flutter
  # For the test that the palette of a seed is Material's own.
  material_ui: ^1.11.0
  spring_boot_starter_test: ^0.8.1
  lints: ^6.0.0
