name: spring_boot_starter_flutter_security
description: >-
  Security for Spring Boot Flutter apps: the OAuth2 / OpenID Connect app login, secrets in the Keychain / Keystore, widgets that follow the logged-in user.
version: 0.8.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_flutter_security
documentation: https://farum-azula.org/components
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - flutter
  - oauth2
  - security
  - spring

environment:
  sdk: ^3.14.0
  # The Flutter that ships Dart 3.14; plugins must name one.
  flutter: '>=3.50.0'


dependencies:
  flutter:
    sdk: flutter
  # The plugin's web entry (it registers nothing: the web has no secure
  # storage and logs in on the server).
  flutter_web_plugins:
    sdk: flutter
  spring_boot_dart: ^0.8.0
  # The connect timeout of the web app's transport comes from the Feign
  # clients' settings (spring.feign.client.*). Not re-exported: an app with
  # Feign clients lists the Feign starter.
  spring_boot_starter_feign: ^0.8.0
  # Re-exported: an app lists only this package.
  spring_boot_starter_flutter: ^0.8.0
  # The guards of the routes (@PreAuthorize on a screen) and the way back
  # after the login. Re-exported.
  spring_boot_starter_flutter_navigation: ^0.8.0
  # The registrations, token endpoint clients, users and authorized
  # clients the app login builds on. Re-exported.
  spring_boot_starter_oauth2_client: ^0.8.0
  # SecurityContextHolder, the expressions of PrincipalView. Re-exported.
  spring_security_core: ^0.8.0

dev_dependencies:
  # For example/: the generator writes example/spring_gen/example.spring.dart.
  build_runner: ^2.17.0
  spring_core_dart_generator: ^0.8.0
  flutter_test:
    sdk: flutter
  spring_boot_starter_test: ^0.8.0
  # For the tests in a Material and in a Cupertino app only: the package
  # itself depends on no design library.
  spring_boot_starter_flutter_material: ^0.8.0
  spring_boot_starter_flutter_cupertino: ^0.8.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  lints: ^6.0.0

# A Flutter plugin: its own platform code keeps secrets in the platform's
# secure storage and opens the login page in the system's login window
# (no community plugins). Windows and Linux call the OS from Dart
# (dart:ffi), so they build nothing native; the web registers nothing.
flutter:
  plugin:
    platforms:
      android:
        package: dev.farumazula.spring_boot_starter_flutter_security
        pluginClass: SpringBootStarterFlutterSecurityPlugin
      ios:
        pluginClass: SpringBootStarterFlutterSecurityPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: SpringBootStarterFlutterSecurityPlugin
        sharedDarwinSource: true
      # `dartFileName` (not the web's `fileName`): the library of the
      # class, which the generated plugin registrant imports.
      windows:
        dartPluginClass: SpringBootStarterFlutterSecurityDesktop
        dartFileName: src/plugin/desktop_plugin.dart
      linux:
        dartPluginClass: SpringBootStarterFlutterSecurityDesktop
        dartFileName: src/plugin/desktop_plugin.dart
      web:
        pluginClass: SpringBootStarterFlutterSecurityWeb
        fileName: src/plugin/web_plugin.dart
