name: spring_boot_starter_edge
description: >-
  Edge starter for spring_boot_dart: the same application as a function on Supabase Edge Functions, Cloudflare Workers and AWS Lambda, behind the fetch API instead of a socket.
version: 0.8.1
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_edge
documentation: https://farum-azula.org/components
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - serverless
  - edge
  - supabase
  - cloudflare
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.8.1
  # Like every starter: logging comes with it.
  spring_boot_starter_logging: ^0.8.1
  # The dispatcher, the filters and the controllers the function runs.
  spring_boot_starter_web: ^0.8.1
  spring_web_dart: ^0.8.1

dev_dependencies:
  build_runner: ^2.17.0
  # The test application checks bearer tokens, as a function does.
  spring_boot_starter_security: ^0.8.1
  spring_boot_starter_test: ^0.8.1
  spring_core_dart_generator: ^0.8.1
  test: ^1.33.0
