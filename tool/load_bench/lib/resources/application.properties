# The load bench server: what every run shares. tool/load.dart passes the
# port, the directories and anything given with --server-arg on the
# command line (--server.port=18080, --bench.directory=...).

spring.application.name=load-bench
# Close the context on Ctrl+C / SIGTERM: the tool stops the server so.
spring.main.register-shutdown-hook=true
spring.main.banner-mode=off

# --- The web server ---------------------------------------------------------
server.port=18080
server.address=127.0.0.1
# Graceful, the default: an isolate that leaves the pool finishes its
# requests first, which the scaling scenarios measure.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
# Uploads: the raw ones read the body as a stream with bench.upload.max-size
# as their limit; the multipart ones use the two keys below.
spring.web.multipart.max-file-size=2GB
spring.web.multipart.max-request-size=2GB
# lib/resources/static/hello.txt is GET /static/hello.txt.
spring.mvc.static-path-pattern=/static/**

# --- Security: a bearer token on /secure/** ----------------------------------
# The server signs a token with this secret at startup (GET /bench/info
# hands it to the load tool) and checks it on every request. A secret of
# the bench only: it protects nothing.
bench.security.jwt-secret=load-bench-secret-of-at-least-32-bytes
bench.security.token-lifetime=24h

# --- The database (spring_boot_starter_data on SQLite) -----------------------
# A file, so every connection (and every server isolate) sees the same
# rows; db/migration/V1__items.sql creates and fills the table.
spring.datasource.url=sqlite:file:${bench.directory}/load_bench.db
spring.datasource.pool.max-size=4
# The schema of each database: db/migration/sqlite or db/migration/postgresql.
# PostgreSQL instead of the SQLite file, for example in Docker:
#   --spring.datasource.url=postgresql://postgres:bench@localhost:55432/bench
spring.sql.migration.locations=resources:db/migration/{vendor}

# --- The bench (BenchProperties) ----------------------------------------------
# Where the files to download are generated and the uploads are written.
# Relative to where the server runs; created at startup.
bench.directory=build/load_bench
bench.files.small-size=4KB
bench.files.medium-size=10MB
bench.files.huge-size=512MB
bench.upload.max-size=2GB
bench.json.items=50

# Warnings only: a log line per request would be measured too.
logging.level.root=warn
