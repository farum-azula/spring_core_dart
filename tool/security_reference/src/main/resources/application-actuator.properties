# The actuator profile (ActuatorReference): the endpoints the Dart
# actuator starter has, with the settings of
# spring_boot_starter_actuator/test/actuator_differential_test.dart.
management.endpoints.access.default=read-only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.core.include=ping
management.endpoint.health.group.core.show-details=never
management.endpoint.health.group.core.show-components=always
management.info.env.enabled=true
info.app.name=reference
info.app.team=books
