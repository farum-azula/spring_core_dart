name: spring_boot_actuator
description: >-
  Spring Boot Actuator for Dart: @Endpoint beans, the health endpoint with indicators and groups, info contributors and the mappings, no HTTP of its own.
version: 0.7.2
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_actuator
documentation: https://farum-azula.org/components
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - actuator
  - health
  - monitoring
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.7.2
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.7.2
  # MappingDescriptions, the interface the mappings endpoint reads.
  spring_web_dart: ^0.7.2

dev_dependencies:
  # For example/: the generator writes example/spring_gen/example.spring.dart.
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.7.2
  spring_core_dart_generator: ^0.7.2
  test: ^1.33.0
