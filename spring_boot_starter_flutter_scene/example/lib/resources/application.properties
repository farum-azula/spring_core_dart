# The example app. A scene draws at most 30 frames a second; the model
# `hero` is loaded when a scene first shows it (the app's own pubspec
# lists the file under flutter: assets:).
spring.flutter.app.title=Showroom
spring.flutter.scene.max-frame-rate=30
spring.flutter.scene.models.hero.source=asset:assets/models/hero.glb
