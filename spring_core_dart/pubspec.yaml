name: spring_core_dart
description: >-
  Spring Core for Dart and Flutter: annotation-based dependency injection, application.properties configuration, profiles, events, SpEL, validation and AOP.
version: 0.4.2
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_core_dart
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - dependency-injection
  - inversion-of-control
  - configuration
  - aop
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  yaml: ^3.1.3

dev_dependencies:
  # For example/: a Spring Boot application, written by the generator
  # (example/main.spring.dart).
  build_runner: ^2.17.0
  coverage: ^1.11.0
  spring_boot_dart: ^0.4.2
  spring_core_dart_generator: ^0.4.2
  test: ^1.33.0
