name: spring_boot_starter_supabase
description: >-
  Supabase starter for spring_boot_dart: its database through Spring Data, Auth through Spring Security, Realtime as streams, Storage and Edge Functions as declared interfaces.
version: 0.8.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_supabase
documentation: https://farum-azula.org/components
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - supabase
  - postgres
  - realtime
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.8.0
  spring_boot_starter_cache: ^0.8.0
  spring_boot_starter_data: ^0.8.0
  spring_boot_starter_feign: ^0.8.0
  # Like every starter: logging comes with it.
  spring_boot_starter_logging: ^0.8.0
  spring_boot_starter_websocket: ^0.8.0
  spring_security_core: ^0.8.0
  spring_web_dart: ^0.8.0

dev_dependencies:
  build_runner: ^2.17.0
  # For the tests of the SQL path (spring.supabase.db.url): the generator
  # writes the driver's glue into the test applications, as it does in an
  # application that lists postgres itself. Never a runtime dependency.
  postgres: ^3.5.0
  # A server that checks the project's tokens (test/server_*_test.dart):
  # the filter chain and the web starter it runs on. Tests only: the
  # starter itself sets properties and depends on neither.
  spring_boot_starter_security: ^0.8.0
  spring_boot_starter_test: ^0.8.0
  spring_core_dart_generator: ^0.8.0
  test: ^1.33.0
