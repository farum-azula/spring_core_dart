# Root runs (`dart test <package>/test` from here) use this file instead of
# the packages' own: the generator tests build in memory and need the margin.
timeout: 6x

tags:
  # Tests that open real sockets/servers or start processes (@Tags at the
  # top of the file). CI runs them in their own job:
  #   dart run tool/test_all.dart --tags integration
  # and the rest with --exclude-tags "integration || differential".
  integration:
    timeout: 2x
  # spring_boot_starter_security against Spring Security itself
  # (tool/security_reference): CI's `differential` job.
  differential:
    timeout: 4x
  # Tests that start containers (@Tags at the top of the file): skipped
  # without Docker, a failure with CONTAINERS_REQUIRED=true. CI's `docker` job.
  docker:
    timeout: 4x
  # spring_boot_starter_supabase: every test of it has `supabase`, and runs
  # in a pipeline of its own (.github/workflows/supabase.yml), never in the
  # jobs above (tool/test_all.dart leaves the package out). The levels are
  # in the package's dart_test.yaml.
  supabase:
  supabase-docker:
    timeout: 4x
  supabase-stack:
    timeout: 4x
  # spring_boot_starter_edge: its function in the platforms' runtimes (the
  # package's dart_test.yaml has the levels).
  edge-node:
    timeout: 4x
  edge-cloudflare:
    timeout: 6x
  edge-deno:
    timeout: 6x
  edge-docker:
    timeout: 6x
