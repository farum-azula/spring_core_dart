# Root runs (`dart test <package>/test` from here) use this file instead of
# the packages' own: the generator tests build in memory and need the margin.
timeout: 6x

tags:
  # Tests that open real sockets/servers or start processes (@Tags at the
  # top of the file). CI runs them in their own job:
  #   dart run tool/test_all.dart --tags integration
  # and the rest with --exclude-tags integration.
  integration:
    timeout: 2x
