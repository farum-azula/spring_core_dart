server.port=8086
# health is exposed by default; these are added.
management.endpoints.web.exposure.include=health,info,mappings,orders
# Everybody sees the components and their details (a demo: in production
# use when-authorized with the security starter).
management.endpoint.health.show-details=always
# The liveness and readiness groups (on by default on Kubernetes).
management.endpoint.health.probes.enabled=true
# The user of the other endpoints; its password is generated and logged.
spring.security.user.name=admin
spring.security.user.roles=ADMIN
