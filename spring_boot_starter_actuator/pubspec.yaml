name: spring_boot_starter_actuator
description: >-
  Spring Boot Actuator over HTTP for Dart servers: /actuator/health with probes and groups, /actuator/info, /actuator/mappings, exposure and discovery links.
version: 0.7.0
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_actuator
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - actuator
  - health
  - monitoring
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # The endpoints (health, info, mappings) and their model.
  spring_boot_actuator: ^0.7.0
  spring_boot_dart: ^0.7.0
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.7.0
  # The endpoints answer through the web starter's dispatcher.
  spring_boot_starter_web: ^0.7.0
  spring_web_dart: ^0.7.0

dev_dependencies:
  # For example/ and test/app/: the generator writes the *.spring.dart files.
  build_runner: ^2.17.0
  # The example and the tests secure the endpoints with EndpointRequest.
  spring_boot_starter_security: ^0.7.0
  spring_boot_starter_test: ^0.7.0
  spring_core_dart_generator: ^0.7.0
  test: ^1.33.0
