issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - websocket
  - realtime
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.1.5
  spring_web_dart: ^0.1.5

dev_dependencies:
  spring_boot_starter_test: ^0.1.5
  test: ^1.33.0
