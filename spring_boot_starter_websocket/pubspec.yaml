name: spring_boot_starter_websocket
description: >-
  Declarative WebSocket clients for spring_boot_dart: annotate an interface with @WebSocketClient, @OnMessage and @SendMessage, inject it as a bean; JSON via ObjectMapper, reconnection, handshake interceptors.
version: 0.1.4
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_websocket
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - websocket
  - realtime
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.1.4
  spring_web_dart: ^0.1.4

dev_dependencies:
  spring_boot_starter_test: ^0.1.4
  test: ^1.33.0
