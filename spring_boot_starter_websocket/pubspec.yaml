name: spring_boot_starter_websocket
description: >-
  Declarative WebSocket clients for spring_boot_dart: an interface with @WebSocketClient, @OnMessage and @SendMessage becomes a bean; JSON via ObjectMapper, reconnection.
version: 0.4.2
repository: https://github.com/farum-azula/spring_core_dart/tree/main/spring_boot_starter_websocket
issue_tracker: https://github.com/farum-azula/spring_core_dart/issues
topics:
  - websocket
  - realtime
  - spring

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  spring_boot_dart: ^0.4.2
  # Like every Spring Boot starter: logging comes with it.
  spring_boot_starter_logging: ^0.4.2
  spring_web_dart: ^0.4.2

dev_dependencies:
  # For example/: the generator writes example/example.spring.dart.
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.4.2
  spring_core_dart_generator: ^0.4.2
  test: ^1.33.0
