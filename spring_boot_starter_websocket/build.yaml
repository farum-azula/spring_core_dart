# The generator writes the example's application (example/example.spring.dart)
# and the server endpoints the tests start (test/server/); the package itself
# is written by hand.
targets:
  $default:
    builders:
      spring_core_dart_generator:spring_core_dart:
        generate_for: [example/**, test/server/**]
      spring_core_dart_generator:spring_test:
        enabled: false
