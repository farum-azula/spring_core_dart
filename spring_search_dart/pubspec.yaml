resolution: workspace

dependencies:
  spring_boot_dart: ^0.7.2

dev_dependencies:
  build_runner: ^2.17.0
  spring_boot_starter_test: ^0.7.2
  spring_core_dart_generator: ^0.7.2
  test: ^1.33.0
